{{- if lt (int .Values.replicaCount) 2 -}}
{{- fail "replicaCount must be at least two" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sprintflow.name" . }}
  labels:
    {{- include "sprintflow.selector" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "sprintflow.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sprintflow.selector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "sprintflow.selector" . | nindent 20 }}
      containers:
        - name: app
          image: {{ include "sprintflow.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - { name: http, containerPort: 8081 }
          envFrom:
            - secretRef:
                name: {{ required "set existingSecret to the SprintFlow runtime Secret" .Values.existingSecret }}
          env:
            - { name: SPRINTFLOW_PUBLIC_URL, value: {{ .Values.publicUrl | quote }} }
            - { name: SPRINTFLOW_COOKIE_SECURE, value: {{ .Values.secureCookies | quote }} }
            - { name: SPRINTFLOW_BROKER_RELAY_ENABLED, value: 'true' }
            - { name: SPRINTFLOW_BROKER_HOST, value: {{ .Values.broker.host | quote }} }
            - { name: SPRINTFLOW_BROKER_PORT, value: {{ .Values.broker.port | quote }} }
            - { name: SPRINTFLOW_BROKER_VHOST, value: {{ .Values.broker.virtualHost | quote }} }
            {{- if .Values.webSocketDiagnostics }}
            - name: SPRINTFLOW_WS_DIAGNOSTICS_INSTANCE
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            {{- end }}
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 5
            failureThreshold: 48
          readinessProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 3
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: scratch, mountPath: /tmp }
            - { name: uploads, mountPath: /app/data }
      volumes:
        - name: scratch
          emptyDir: {}
        - name: uploads
          {{- if .Values.uploads.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.uploads.existingClaim | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}

name: sprintflow-insight
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sprintflow
      POSTGRES_USER: sprintflow
      POSTGRES_PASSWORD: ${SPRINTFLOW_DB_PASSWORD:?Set SPRINTFLOW_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SPRINTFLOW_DB_PORT:-5432}:5432"
    volumes:
      - sprintflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprintflow -d sprintflow"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    user: "${SPRINTFLOW_CONTAINER_UID:-1000}:${SPRINTFLOW_CONTAINER_GID:-1000}"
    environment:
      SPRINTFLOW_DB_URL: jdbc:postgresql://postgres:5432/sprintflow
      SPRINTFLOW_DB_USER: sprintflow
      SPRINTFLOW_DB_PASSWORD: ${SPRINTFLOW_DB_PASSWORD:?Set SPRINTFLOW_DB_PASSWORD in .env}
      SPRINTFLOW_ENCRYPTION_KEY: ${SPRINTFLOW_ENCRYPTION_KEY:?Set SPRINTFLOW_ENCRYPTION_KEY in .env}
      SPRINTFLOW_ENCRYPTION_PREVIOUS_KEYS: ${SPRINTFLOW_ENCRYPTION_PREVIOUS_KEYS:-}
      SPRINTFLOW_COOKIE_SECURE: ${SPRINTFLOW_COOKIE_SECURE:-false}
      SPRINTFLOW_PUBLIC_URL: ${SPRINTFLOW_PUBLIC_URL:-http://localhost:8081}
      SPRINTFLOW_GOOGLE_CLIENT_ID: ${SPRINTFLOW_GOOGLE_CLIENT_ID:-}
      SPRINTFLOW_SMTP_USERNAME: ${SPRINTFLOW_SMTP_USERNAME:-}
      SPRINTFLOW_SMTP_PASSWORD: ${SPRINTFLOW_SMTP_PASSWORD:-}
      SPRINTFLOW_SMTP_HOST: ${SPRINTFLOW_SMTP_HOST:-smtp.gmail.com}
      SPRINTFLOW_SMTP_PORT: ${SPRINTFLOW_SMTP_PORT:-587}
    ports:
      - "127.0.0.1:${SPRINTFLOW_APP_PORT:-8081}:8081"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  sprintflow-postgres:

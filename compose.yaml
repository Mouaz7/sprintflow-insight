name: sprintflow-insight
services:
  postgres:
    # Pinned by digest; Dependabot (docker-compose ecosystem) proposes updates.
    image: postgres:16.16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
    environment:
      POSTGRES_DB: sprintflow
      POSTGRES_USER: sprintflow
      POSTGRES_PASSWORD: ${SPRINTFLOW_DB_PASSWORD:?Set SPRINTFLOW_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SPRINTFLOW_DB_PORT:-5432}:5432"
    volumes:
      - sprintflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprintflow -d sprintflow"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    # CI builds the image once and starts it with --no-build under this name.
    image: ${SPRINTFLOW_APP_IMAGE:-sprintflow-insight-app:local}
    user: "${SPRINTFLOW_CONTAINER_UID:-1000}:${SPRINTFLOW_CONTAINER_GID:-1000}"
    environment:
      SPRINTFLOW_DB_URL: jdbc:postgresql://postgres:5432/sprintflow
      SPRINTFLOW_DB_USER: sprintflow
      SPRINTFLOW_DB_PASSWORD: ${SPRINTFLOW_DB_PASSWORD:?Set SPRINTFLOW_DB_PASSWORD in .env}
      SPRINTFLOW_ENCRYPTION_KEY: ${SPRINTFLOW_ENCRYPTION_KEY:?Set SPRINTFLOW_ENCRYPTION_KEY in .env}
      SPRINTFLOW_ENCRYPTION_PREVIOUS_KEYS: ${SPRINTFLOW_ENCRYPTION_PREVIOUS_KEYS:-}
      SPRINTFLOW_COOKIE_SECURE: ${SPRINTFLOW_COOKIE_SECURE:-false}
      SPRINTFLOW_PUBLIC_URL: ${SPRINTFLOW_PUBLIC_URL:-http://localhost:8081}
      SPRINTFLOW_GOOGLE_CLIENT_ID: ${SPRINTFLOW_GOOGLE_CLIENT_ID:-}
      SPRINTFLOW_SMTP_USERNAME: ${SPRINTFLOW_SMTP_USERNAME:-}
      SPRINTFLOW_SMTP_PASSWORD: ${SPRINTFLOW_SMTP_PASSWORD:-}
      SPRINTFLOW_SMTP_HOST: ${SPRINTFLOW_SMTP_HOST:-smtp.gmail.com}
      SPRINTFLOW_SMTP_PORT: ${SPRINTFLOW_SMTP_PORT:-587}
      SPRINTFLOW_ACCOUNT_EXPORT_MAX_BYTES: ${SPRINTFLOW_ACCOUNT_EXPORT_MAX_BYTES:-67108864}
      SPRINTFLOW_MANAGEMENT_PORT: "8082"
      SPRINTFLOW_MANAGEMENT_ADDRESS: 0.0.0.0
      SPRINTFLOW_TRACING_EXPORT: ${SPRINTFLOW_TRACING_EXPORT:-false}
      SPRINTFLOW_TRACE_SAMPLE_RATE: ${SPRINTFLOW_TRACE_SAMPLE_RATE:-0.1}
      SPRINTFLOW_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    ports:
      - "127.0.0.1:${SPRINTFLOW_APP_PORT:-8081}:8081"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks: [default, observability]
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - sprintflow-prometheus:/prometheus
    networks: [observability]
  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    profiles: [observability]
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
    tmpfs:
      - /var/tempo:uid=10001,gid=10001,mode=0700,size=512m
    networks: [observability]
  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:${SPRINTFLOW_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - sprintflow-grafana:/var/lib/grafana
    networks: [observability]
volumes:
  sprintflow-postgres:
  sprintflow-prometheus:
  sprintflow-grafana:
networks:
  observability:

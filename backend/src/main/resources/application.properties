spring.datasource.url=${SPRINTFLOW_DB_URL:jdbc:postgresql://localhost:5432/sprintflow}
spring.datasource.username=${SPRINTFLOW_DB_USER:sprintflow}
spring.datasource.password=${SPRINTFLOW_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.sql.init.mode=never
server.port=${PORT:8081}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.servlet.session.timeout=30m
# Compress static assets only. HTML and JSON stay uncompressed so responses that carry
# CSRF tokens or nonces are not exposed to compression side channels (BREACH).
server.compression.enabled=true
server.compression.mime-types=text/javascript,application/javascript,text/css,image/svg+xml
server.compression.min-response-size=1KB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SPRINTFLOW_COOKIE_SECURE:true}
server.servlet.session.tracking-modes=cookie
springdoc.api-docs.path=/api/v1/openapi
springdoc.paths-to-match=/api/v1/projects,/api/v1/projects/**
server.servlet.session.cookie.name=SPRINTFLOW_SESSION
# Sessions live in PostgreSQL (Flyway V13 owns the schema).
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.cleanup-cron=0 */5 * * * *
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
spring.mail.host=${SPRINTFLOW_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SPRINTFLOW_SMTP_PORT:587}
spring.mail.username=${SPRINTFLOW_SMTP_USERNAME:}
spring.mail.password=${SPRINTFLOW_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.password-reset.from=${SPRINTFLOW_SMTP_USERNAME:}
app.password-reset.base-url=${SPRINTFLOW_PUBLIC_URL:http://localhost:8081}
app.google.client-id=${SPRINTFLOW_GOOGLE_CLIENT_ID:}

spring.application.name=sprintflow-insight
management.server.port=${SPRINTFLOW_MANAGEMENT_PORT:0}
management.server.address=${SPRINTFLOW_MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoints.web.discovery.enabled=false
management.health.mail.enabled=false
management.tracing.export.otlp.enabled=${SPRINTFLOW_TRACING_EXPORT:false}
management.tracing.sampling.probability=${SPRINTFLOW_TRACE_SAMPLE_RATE:0.1}
management.tracing.baggage.enabled=false
management.opentelemetry.tracing.export.otlp.endpoint=${SPRINTFLOW_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.connect-timeout=2s
management.opentelemetry.tracing.export.otlp.timeout=3s
management.otlp.metrics.export.enabled=false
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=300ms
logging.structured.format.console=${SPRINTFLOW_LOG_FORMAT:logstash}

# Reject fractional JSON values for integer fields instead of silently truncating them.
spring.jackson.deserialization.accept-float-as-int=false

# Flyway owns the event registry schema. Completed events contain no permanent payload copy.
spring.modulith.events.jdbc.schema-initialization.enabled=false
spring.modulith.events.completion-mode=delete
# The scheduled maintenance claims outstanding work before resubmitting it on any replica.
spring.modulith.events.republish-outstanding-events-on-restart=false
# EventPublicationMaintenance retries incomplete publications every minute until they reach this
# age, then logs and removes them.
app.events.max-retry-age=${SPRINTFLOW_EVENTS_MAX_RETRY_AGE:PT24H}
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=10s

# Java 25 virtual request, scheduling and module-listener threads.
spring.threads.virtual.enabled=true
# Virtual async execution is unbounded unless configured. B1's broker causes Boot to back off,
# so WebSocketConfiguration restores a named, bounded virtual executor using this same limit.
# Module listeners each hold a database connection, so a burst of events (for example the
# restart republish or a resubmission) could take the whole pool and starve HTTP requests. Keep
# the listener limit well below the pool size; extra tasks queue without blocking publishers.
spring.datasource.hikari.maximum-pool-size=${SPRINTFLOW_DB_POOL_SIZE:10}
spring.task.execution.simple.concurrency-limit=4
app.events.executor-queue-capacity=1000
spring.main.keep-alive=true
# Modulith 2 can read and retry the existing V14 registry without destructive schema changes.
spring.modulith.events.jdbc.use-legacy-structure=true
# Preserve optional primitive request-field defaults from the existing HTTP contract.
spring.jackson.deserialization.fail-on-null-for-primitives=false
# The public health document remains status-only; probe groups belong to C6's deployment phase.
management.endpoint.health.probes.enabled=false

# AES-256-GCM data key, Base64 of 32 random bytes (ADR 0015). Required: startup fails without it.
# The start scripts generate it into .env. During rotation, list the retired keys comma separated.
app.encryption.key=${SPRINTFLOW_ENCRYPTION_KEY:}
app.encryption.previous-keys=${SPRINTFLOW_ENCRYPTION_PREVIOUS_KEYS:}

# Realtime (B1, ADR 0017). The WebSocket handshake accepts browser Origins from this list only
# (default: the public URL). The replay log for gap filling keeps this long and at most this many
# messages per project; presence entries expire when a connection is not confirmed for the TTL.
app.realtime.allowed-origins=${SPRINTFLOW_REALTIME_ORIGINS:${app.password-reset.base-url}}
app.realtime.relay.enabled=${SPRINTFLOW_BROKER_RELAY_ENABLED:false}
app.realtime.relay.host=${SPRINTFLOW_BROKER_HOST:localhost}
app.realtime.relay.port=${SPRINTFLOW_BROKER_PORT:61613}
app.realtime.relay.login=${SPRINTFLOW_BROKER_LOGIN:}
app.realtime.relay.passcode=${SPRINTFLOW_BROKER_PASSCODE:}
app.realtime.relay.virtual-host=${SPRINTFLOW_BROKER_VHOST:/}
app.realtime.diagnostics-instance=${SPRINTFLOW_WS_DIAGNOSTICS_INSTANCE:}
app.realtime.retention=P7D
app.realtime.max-events-per-project=1000
app.realtime.presence-ttl=PT90S
app.realtime.sweep-ms=30000

# B19: total uncompressed account archive; 1–128 MiB, no partial ZIP is returned.
app.account-export.max-bytes=${SPRINTFLOW_ACCOUNT_EXPORT_MAX_BYTES:67108864}

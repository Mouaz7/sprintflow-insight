spring.datasource.url=${SPRINTFLOW_DB_URL:jdbc:postgresql://localhost:5432/sprintflow}
spring.datasource.username=${SPRINTFLOW_DB_USER:sprintflow}
spring.datasource.password=${SPRINTFLOW_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.sql.init.mode=never
server.port=${PORT:8081}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SPRINTFLOW_COOKIE_SECURE:true}
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=SPRINTFLOW_SESSION
# Sessions live in PostgreSQL (Flyway V13 owns the schema).
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.cleanup-cron=0 */5 * * * *
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
spring.mail.host=${SPRINTFLOW_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SPRINTFLOW_SMTP_PORT:587}
spring.mail.username=${SPRINTFLOW_SMTP_USERNAME:}
spring.mail.password=${SPRINTFLOW_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.password-reset.from=${SPRINTFLOW_SMTP_USERNAME:}
app.password-reset.base-url=${SPRINTFLOW_PUBLIC_URL:http://localhost:8081}
app.google.client-id=${SPRINTFLOW_GOOGLE_CLIENT_ID:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoints.web.discovery.enabled=false
management.health.mail.enabled=false

# Reject fractional JSON values for integer fields instead of silently truncating them.
spring.jackson.deserialization.accept-float-as-int=false

# Flyway owns the event registry schema. Completed events contain no permanent payload copy.
spring.modulith.events.jdbc.schema-initialization.enabled=false
spring.modulith.events.completion-mode=delete
spring.modulith.events.republish-outstanding-events-on-restart=true
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=10s

# Java 25 virtual request, scheduling and module-listener threads.
spring.threads.virtual.enabled=true
# With virtual threads the async executor is a SimpleAsyncTaskExecutor with no limit by default.
# Module listeners each hold a database connection, so a burst of events (for example the
# restart republish or a resubmission) could take the whole pool and starve HTTP requests. Keep
# the listener limit well below the pool size; extra tasks wait for a free slot.
spring.datasource.hikari.maximum-pool-size=${SPRINTFLOW_DB_POOL_SIZE:10}
spring.task.execution.simple.concurrency-limit=4
spring.main.keep-alive=true
# Modulith 2 can read and retry the existing V14 registry without destructive schema changes.
spring.modulith.events.jdbc.use-legacy-structure=true
# Preserve optional primitive request-field defaults from the existing HTTP contract.
spring.jackson.deserialization.fail-on-null-for-primitives=false
# The public health document remains status-only; probe groups belong to C6's deployment phase.
management.endpoint.health.probes.enabled=false

      - version
      properties:
        id: *pokerSchema002
        projectId: *pokerSchema002
        storyId: *pokerSchema002
        storyTitle: *pokerSchema004
        storyPoints: *pokerSchema007
        storyVersion: *pokerSchema002
        deck: *pokerSchema008
        cards:
          type: array
          items: *pokerSchema004
        status: *pokerSchema009
        round: *pokerSchema001
        facilitatorUserId:
          type: integer
          format: int64
          nullable: true
        voters:
          type: array
          items:
            $ref: '#/components/schemas/PokerVoter'
        myCard:
          type: string
          nullable: true
        rounds:
          type: array
          items:
            $ref: '#/components/schemas/PokerRound'
        finalValue:
          type: string
          nullable: true
        finalStoryPoints:
          type: integer
          enum: *pokerSchema003
          nullable: true

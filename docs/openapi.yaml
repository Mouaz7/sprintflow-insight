      parameters:
      - $ref: '#/components/parameters/ifMatch'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SPRINTFLOW_SESSION
  parameters:
    exportStatus:
      in: query
      name: status
      schema: { type: string, enum: ['To Do', 'In Progress', 'Review', 'Done'] }
    exportSprint:
      in: query
      name: sprint
      schema: { type: string, enum: [backlog] }
    exportAssignee:
      in: query
      name: assignee
      schema: { type: string, description: 'Project member email or unassigned', maxLength: 320 }
    exportDue:
      in: query
      name: due
      schema: { type: string, enum: [overdue, has-date, no-date] }
    exportBlocked:
      in: query
      name: blocked
      schema: { type: boolean }
    exportLabel:
      in: query
      name: label
      schema: { type: string, maxLength: 32 }
    exportQ:
      in: query
      name: q
      schema: { type: string, maxLength: 1000 }
    ifMatch:
      in: header
      name: If-Match
      required: true
      description: Quoted current entity version; missing returns 428, stale returns 412.
      schema: { type: string, example: '"0"' }
    page:
      in: query
      name: page
      description: Optional zero-based page. Omit to retrieve the complete accessible list.
      schema: { type: integer, minimum: 0 }
    size:
      in: query
      name: size
      description: Number of items when page is supplied.
      schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
    id:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64 }
    projectId:
      in: path
      name: projectId
      required: true
      schema: { type: integer, format: int64 }
    taskId:
      in: path
      name: taskId
      required: true
      schema: { type: integer, format: int64 }
  responses:
    RateLimited:
      description: >-
        Rate limit reached. Credential endpoints are limited per client address (fixed refill);
        every other write is limited per account (300/min, smooth refill; uploads 30/min).
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema: { type: integer, minimum: 1 }
        RateLimit-Limit:
          description: Bucket capacity for the applied policy.
          schema: { type: integer }
        RateLimit-Remaining:
          description: Tokens left after this request.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Error:
      description: >-
        RFC 9457 problem document. Branch on `code` (or `type`), never on the human-readable text.
      headers:
        Retry-After:
          description: Present for SERVICE_UNAVAILABLE database failures; seconds before retrying.
          schema: { type: integer, minimum: 1, example: 5 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    EpicRequest:
      type: object
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
          nullable: true
        color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          nullable: true
        startDate:
          type: string
          format: date
          nullable: true
        targetDate:
          type: string
          format: date
          nullable: true
      description: 'Optional dates must be between 1900-01-01 and 9999-12-31, target on or after start. Null
        colour uses #4f46e5.'
    EpicView:
      type: object
      required:
      - id
      - title
      - description
      - color
      - startDate
      - targetDate
      - version
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
          nullable: true
        color:
          type: string
        startDate:
          type: string
          format: date
          nullable: true
        targetDate:
          type: string
          format: date
          nullable: true
        version:
          type: integer
          format: int64
    StoryEpicRequest:
      type: object
      properties:
        epicId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
    StoryEpicView:
      type: object
      required:
      - storyId
      - epicId
      - version
      properties:
        storyId:
          type: integer
          format: int64
        epicId:
          type: integer
          format: int64
          nullable: true
        version:
          type: integer
          format: int64
    DependencyRequest:
      type: object
      required:
      - blockerTaskId
      - blockedTaskId
      properties:
        blockerTaskId:
          type: integer
          format: int64
          minimum: 1
        blockedTaskId:
          type: integer
          format: int64
          minimum: 1
    EstimateRequest:
      type: object
      required:
      - optimistic
      - mostLikely
      - pessimistic
      properties:
        optimistic:
          type: number
          format: double
          minimum: 0
          maximum: 1000
          multipleOf: 0.01
        mostLikely:
          type: number
          format: double
          minimum: 0
          maximum: 1000
          multipleOf: 0.01
        pessimistic:
          type: number
          format: double
          minimum: 0
          maximum: 1000
          multipleOf: 0.01
    TaskRef:
      type: object
      required:
      - id
      - key
      - title
      - status
      - sprintId
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
        title:
          type: string
        status:
          type: string
        sprintId:
          type: integer
          format: int64
          nullable: true
    DependencyView:
      type: object
      required:
      - id
      - blocker
      - blocked
      - open
      properties:
        id:
          type: integer
          format: int64
        blocker:
          $ref: '#/components/schemas/TaskRef'
        blocked:
          $ref: '#/components/schemas/TaskRef'
        open:
          type: boolean
    ExternalBlock:
      type: object
      required:
      - task
      - blocker
      properties:
        task:
          $ref: '#/components/schemas/TaskRef'
        blocker:
          $ref: '#/components/schemas/TaskRef'
    DependencyOverview:
      type: object
      required:
      - dependencies
      - blockedTaskIds
      - externalBlocks
      properties:
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/DependencyView'
        blockedTaskIds:
          type: array
          items:
            type: integer
            format: int64
        externalBlocks:
          type: array
          items:
            $ref: '#/components/schemas/ExternalBlock'
    EstimateView:
      type: object
      required:
      - taskId
      - task
      - optimistic
      - mostLikely
      - pessimistic
      - expected
      - standardDeviation
      - version
      properties:
        taskId:
          type: integer
          format: int64
        task:
          $ref: '#/components/schemas/TaskRef'
        optimistic:
          type: number
          format: double
        mostLikely:
          type: number
          format: double
        pessimistic:
          type: number
          format: double
        expected:
          type: number
          format: double
        standardDeviation:
          type: number
          format: double
        version:
          type: integer
          format: int64
    Forecast:
      type: object
      required:
      - start
      - expectedDays
      - standardDeviationDays
      - expectedFinish
      - probabilityOnTime
      - estimatedTasks
      - openTasks
      - unplannedStories
      - criticalPath
      properties:
        start:
          type: string
          format: date
          nullable: false
        expectedDays:
          type: number
          format: double
        standardDeviationDays:
          type: number
          format: double
        expectedFinish:
          type: string
          format: date
          nullable: true
        probabilityOnTime:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1
        estimatedTasks:
          type: integer
          format: int64
        openTasks:
          type: integer
          format: int64
        unplannedStories:
          type: integer
          format: int64
        criticalPath:
          type: array
          items:
            $ref: '#/components/schemas/TaskRef'
      description: Remaining-work PERT normal approximation on the expected critical path. Includes unfinished
        outside ancestors. Monday-Friday calendar, independent durations, no holiday calendar; near-equal
        parallel paths may make the probability optimistic. Finish and probability are null for missing estimates
        or unplanned stories. See ADR 0019.
    RoadmapEpic:
      type: object
      required:
      - epic
      - plannedStart
      - plannedEnd
      - storyCount
      - totalPoints
      - donePoints
      - taskCount
      - doneTaskCount
      - progress
      - storyIds
      - sprintIds
      - forecast
      properties:
        epic:
          $ref: '#/components/schemas/EpicView'
        plannedStart:
          type: string
          format: date
          nullable: true
        plannedEnd:
          type: string
          format: date
          nullable: true
        storyCount:
          type: integer
          format: int64
        totalPoints:
          type: integer
          format: int64
        donePoints:
          type: integer
          format: int64
        taskCount:
          type: integer
          format: int64
        doneTaskCount:
          type: integer
          format: int64
        progress:
          type: number
          format: double
        storyIds:
          type: array
          items:
            type: integer
            format: int64
        sprintIds:
          type: array
          items:
            type: integer
            format: int64
        forecast:
          $ref: '#/components/schemas/Forecast'
    RoadmapSprint:
      type: object
      required:
      - id
      - name
      - status
      - startDate
      - endDate
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
    EpicLink:
      type: object
      required:
      - fromEpicId
      - toEpicId
      - dependencies
      - open
      properties:
        fromEpicId:
          type: integer
          format: int64
        toEpicId:
          type: integer
          format: int64
        dependencies:
          type: integer
          format: int64
        open:
          type: integer
          format: int64
    Roadmap:
      type: object
      required:
      - today
      - epics
      - sprints
      - epicLinks
      - dependencies
      - project
      properties:
        today:
          type: string
          format: date
          nullable: false
        epics:
          type: array
          items:
            $ref: '#/components/schemas/RoadmapEpic'
        sprints:
          type: array
          items:
            $ref: '#/components/schemas/RoadmapSprint'
        epicLinks:
          type: array
          items:
            $ref: '#/components/schemas/EpicLink'
        dependencies:
          $ref: '#/components/schemas/DependencyOverview'
        project:
          $ref: '#/components/schemas/Forecast'
    ProjectRequest:
      type: object
      description: Client-settable project fields. The owner is always the signed-in user.
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 255, nullable: true }
        key:
          type: string
          nullable: true
          pattern: '^\s*[A-Za-z]{2,10}\s*$'
          description: >-
            Project key, stored upper case (e.g. SF). On create it is derived from the name when
            omitted (initials, collisions resolved with a letter suffix); on update omission keeps
            the current key. A key in use answers 409 CONFLICT. Changing it renames every task
            identifier of the project; numbers stay.
    Project:
      type: object
      required: [id, name, key, ownerEmail, version]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string, nullable: true }
        key: { type: string, pattern: '^[A-Z]{2,10}$', example: SF }
        ownerEmail: { type: string, format: email }
        version: { type: integer, format: int64 }
        archivedAt: { type: string, format: date-time, nullable: true }
        trashedAt: { type: string, format: date-time, nullable: true }
    SearchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }
        nextCursor:
          type: string
          nullable: true
          description: Pass as cursor for the next page; null on the last page.
    SearchHit:
      type: object
      required: [type, id, projectId, projectKey, projectName, title, titleSegments, snippet, exactMatch]
      properties:
        type: { type: string, enum: [epic, task, story, sprint, comment, project] }
        id: { type: integer, format: int64, description: Id of the matched item; for a comment the comment id. }
        projectId: { type: integer, format: int64 }
        projectKey: { type: string, example: SF }
        projectName: { type: string }
        taskId: { type: integer, format: int64, nullable: true, description: The task to open for task and comment hits. }
        key: { type: string, nullable: true, example: SF-123, description: Task key for task and comment hits. }
        title: { type: string, description: Title or name; for a comment its task's title. }
        titleSegments:
          type: array
          items: { $ref: '#/components/schemas/SearchSegment' }
        snippet:
          type: array
          description: A short extract of the body; empty when the item has no body.
          items: { $ref: '#/components/schemas/SearchSegment' }
        exactMatch: { type: boolean, description: True when the query was exactly this task's key. }
    SearchSegment:
      type: object
      description: Plain text; match marks words that matched the query. Never markup.
      required: [text, match]
      properties:
        text: { type: string }
        match: { type: boolean }
    Task:
      type: object
      description: A task as returned by the API. number, projectKey and key are server owned.
      required: [id, title, status, projectId, number, key]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        status: { type: string, enum: [To Do, In Progress, Review, Done] }
        projectId: { type: integer, format: int64 }
        number:
          type: integer
          minimum: 1
          description: Per-project sequence number, allocated once and never reused.
        projectKey: { type: string, example: SF }
        key: { type: string, example: SF-123, description: 'Human identifier: projectKey-number.' }
        version: { type: integer, format: int64 }
    StoryRequest:
      type: object
      description: Client-settable story fields. Backlog position changes only through the order endpoint.
      required: [title, acceptanceCriteria, projectId]
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 255, nullable: true }
        acceptanceCriteria: { type: string, maxLength: 255 }
        storyPoints: { type: integer, enum: [1, 2, 3, 5, 8] }
        priorityId: { type: integer, minimum: 1, maximum: 3 }
        businessValue: { type: integer, minimum: 1, maximum: 5, nullable: true }
        projectId: { type: integer, format: int64 }
        sprintId: { type: integer, format: int64, nullable: true }
    SprintRequest:
      type: object
      required: [name, status, projectId, startDate, endDate]
      properties:
        name: { type: string, maxLength: 255 }
        goal: { type: string, maxLength: 255, nullable: true }
        status: { type: string, enum: [Planned, Active, Completed, Cancelled] }
        totalStoryPoints: { type: integer, minimum: 0 }
        projectId: { type: integer, format: int64 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    TaskRequest:
      type: object
      description: >-
        Client-settable task fields. Ids, versions, timestamps and recycle-bin state are
        ignored if sent, so they cannot be mass-assigned.
      required: [title, status, projectId]
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 255, nullable: true }
        status: { type: string, enum: [To Do, In Progress, Review, Done] }
        blocked: { type: boolean }
        blockReason: { type: string, maxLength: 255, nullable: true }
        projectId: { type: integer, format: int64 }
        sprintId: { type: integer, format: int64, nullable: true }
        storyId: { type: integer, format: int64, nullable: true }
        assigneeEmail: { type: string, maxLength: 255, nullable: true }
        storyPoints: { type: integer, minimum: 0, maximum: 1000 }
        dueAt: { type: string, format: date-time, nullable: true }
        labels: { type: array, maxItems: 12, items: { type: string, maxLength: 32 } }
        checklist:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string, maxLength: 80 }
              label: { type: string, maxLength: 180 }
              completed: { type: boolean }
              required: { type: boolean }
    PreferencesRequest:
      type: object
      description: Partial update; omitted fields keep their stored value.
      properties:
        language: { type: string, enum: [EN, SV] }
        theme: { type: string, enum: [light, dark] }
        notifications: { type: boolean }
        onboardingCompleted: { type: boolean }
        savedFilters:
          type: string
          maxLength: 30000
          description: JSON array (max 30) of objects with non-blank `id` and `name` (max 80 characters).
    RealtimeMessage:
      type: object
      description: Names what changed, never its content. Clients reload the entity through the REST API.
      required: [projectId, seq, type]
      properties:
        projectId: { type: integer, format: int64 }
        seq: { type: integer, format: int64, description: Strictly increasing per project }
        type:
          type: string
          example: TaskMoved
          description: TaskCreated, TaskMoved, TaskUpdated, TaskDeleted, CommentAdded, CommentUpdated, CommentDeleted, SprintStatusChanged, NotificationsChanged, or an aggregate activity event such as STORY_DELETED.
        entityId: { type: integer, format: int64, nullable: true, description: Entity id according to type (task/sprint/story/project); comment events identify the task and notification events have no entity id. }
        version: { type: integer, format: int64, nullable: true, description: Entity version after the change; null when deleted or unknown }
    RealtimeEventPage:
      type: object
      required: [projectId, latestSeq, resync, events]
      properties:
        projectId: { type: integer, format: int64 }
        latestSeq: { type: integer, format: int64, description: Newest sequence number, 0 before the first message }
        resync: { type: boolean, description: The range is incomplete; reload the project and continue from latestSeq }
        events:
          type: array
          items: { $ref: '#/components/schemas/RealtimeMessage' }
    OpenTaskPresenceRequest:
      type: object
      properties:
        taskId: { type: integer, format: int64, minimum: 1, nullable: true, description: Null clears the open task. }
    PresenceMessage:
      type: object
      required: [projectId, viewers]
      properties:
        projectId: { type: integer, format: int64 }
        viewers:
          type: array
          items:
            type: object
            required: [userId, name, taskIds]
            properties:
              userId: { type: integer, format: int64 }
              name: { type: string, description: Display name only; never email. }
              taskIds:
                type: array
                items: { type: integer, format: int64 }
    Problem:
      type: object
      required: [type, title, status, detail, code, message]
      properties:
        type:
          type: string
          format: uri
          description: Stable problem type, `https://sprintflow.dev/problems/<kebab-case code>`.
          example: https://sprintflow.dev/problems/validation-failed
        title: { type: string, example: Validation failed }
        status: { type: integer, example: 400 }
        detail: { type: string, description: Human-readable explanation for this occurrence. }
        instance: { type: string, description: Request path that failed. }
        code:
          type: string
          enum: [MALFORMED_REQUEST, VALIDATION_FAILED, INVALID_PARAMETER, MISSING_PARAMETER, BAD_REQUEST, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, NOT_ACCEPTABLE, CONFLICT, GONE, PRECONDITION_FAILED, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, PRECONDITION_REQUIRED, RATE_LIMITED, INTERNAL_ERROR, SERVICE_UNAVAILABLE]
        message: { type: string, description: Same text as `detail`; kept for older clients. }
        errors:
          type: array
          description: Present for VALIDATION_FAILED.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        cycle:
          type: array
          description: Present for a dependency-cycle CONFLICT; task IDs in traversal order with the first repeated at the end.
          items: { type: integer, format: int64 }
        cycleKeys:
          type: array
          description: The same scoped cycle as human task keys, suitable for plain-text feedback.
          items: { type: string }
        errorId: { type: string, description: Present for INTERNAL_ERROR; quote it when reporting a problem. }
    Registration:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6, maxLength: 72 }
        displayName: { type: string, minLength: 1, maxLength: 80 }

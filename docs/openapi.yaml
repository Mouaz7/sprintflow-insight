            $ref: '#/components/schemas/FlowCumulativeDay'
        cycleTimeHours:
          $ref: '#/components/schemas/FlowDistribution'
        leadTimeHours:
          $ref: '#/components/schemas/FlowDistribution'
        completedTasks:
          type: integer
          format: int64
          minimum: 0
        throughputPerDay:
          type: number
          format: double
        completions:
          type: array
          items:
            $ref: '#/components/schemas/FlowCompletion'
        agingWip:
          type: array
          items:
            $ref: '#/components/schemas/FlowAgingTask'
        columns:
          type: array
          items:
            $ref: '#/components/schemas/FlowColumn'
        controlChart:
          $ref: '#/components/schemas/FlowControlChart'
        littlesLaw:
          $ref: '#/components/schemas/FlowLittlesLaw'
        tasksWithoutHistory:
          type: integer
          format: int64
          minimum: 0
      description: Whole UTC days ending at generation time, from currently visible project tasks. Missing
        history is excluded from historical charts/times but current counts include all live tasks. Cycle
        time is the latest uninterrupted active run ending in Done. Percentiles use type-7 interpolation over
        window completions; null durations are omitted. Later trash/deletion changes this current-scope historical
        view.

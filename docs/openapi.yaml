        canFacilitate: *pokerSchema006
        createdAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
        version: *pokerSchema002
      description: Caller-specific snapshot. Before reveal, voters contain identities only and myCard is only the caller’s
        card. rounds contains only previously revealed rounds; it never includes current unrevealed votes or statistics.
        finalValue is the chosen numeric card when present in the deck, otherwise the lower median that informed the
        explicit story-point mapping. Archived projects are readable; writes are denied.

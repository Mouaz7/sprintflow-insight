        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /api/auth/digest:
    get:
      summary: Read your email summary preference
      description: Authenticated account only. Defaults to OFF/UTC with revision zero without inserting a row. mailConfigured indicates configured credentials, not a tested SMTP connection.
      responses:
        '200':
          description: Personal preference and next due instant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DigestPreference' }
        '401': { $ref: '#/components/responses/Error' }
    put:
      summary: Save your email summary preference
      description: OFF, DAILY at 08:00 or WEEKLY on Monday at 08:00 in the chosen IANA zone. Requires the revision read by the caller, including zero for the default. No other account id is accepted. Without SMTP the preference is saved but no mail is sent. In-app notification opt-out also pauses summaries.
      parameters:
      - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DigestPreferenceRequest' }
      responses:
        '200':
          description: Saved preference with revision starting at one
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DigestPreference' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /api/digest/unsubscribe:
    post:
      summary: Confirm email-summary opt-out with an authenticated link token
      security: []
      description: No sign-in is needed, but standard CSRF protection still applies. GET navigation to /email-preferences only renders a confirmation page; it never changes settings. Tokens are opaque, authenticated, expire after 90 days and stop working after re-enabling a subscription. Repeated valid opt-out is idempotent. In-app notifications are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DigestUnsubscribeRequest' }
      responses:
        '204': { description: Email summaries stopped; no account details returned }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/projects/{projectId}/imports/preview:
    parameters:
    - { in: path, name: projectId, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: Preview a bounded CSV or Jira JSON import
      description: Read-only snapshot. Owner, Admin or Member in an active project. Historical milestone preservation requires Owner or Admin. At most 200 tasks and one million input characters. No writes or notifications.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportPreview' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/projects/{projectId}/imports:
    parameters:
    - { in: path, name: projectId, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: Read recent project import receipts
      description: All current project roles, including archived reads. At most 50 receipts.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ImportBatch' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      summary: Commit the reviewed import atomically
      description: Requires the preview fingerprint and current write access under the project lock. Same canonical request replays its receipt; existing external source keys are skipped without updating tasks. A changed mapping, schema, membership or duplicate set returns 409. Any invalid row aborts the whole batch.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/projects/{projectId}/audit:
    parameters:
    - { in: path, name: projectId, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: Read retained administrative audit metadata
      description: Owner or Admin, including archived projects. Keyset pagination newest first. No write endpoint; 90-day retention. Deleted projects are not readable.
      parameters:
      - { in: query, name: before, schema: { type: integer, format: int64, minimum: 1 } }
      - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/account/export:
    post:
      summary: Export the authenticated account as JSON ZIP
      description: Session account only, CSRF required. No-store archive includes explicitly projected profile, preferences, attributed contributions, currently readable project data and stored attachments. No credentials or other participants hidden votes. Default 64 MiB uncompressed and 100000 rows per section; exceeds limits with 413 and no partial response. Two requests per account per minute. Export scope and legacy authorship limitations are in manifest.json.
      responses:
        '200':
          description: Successful response
          content:
            application/zip:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/projects/{projectId}/sprint-plan/options:
    parameters:
    - $ref: '#/components/parameters/projectId'
    get:
      summary: Read backlog, configured capacity and reserved commitments for a sprint scenario
      parameters:
      - { name: sprintId, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      - { name: unit, in: query, schema: { type: string, enum: [POINTS, HOURS], default: POINTS } }
      responses:
        '200':
          description: Scoped scenario inputs for a planned or active sprint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SprintPlanningOptions' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/projects/{projectId}/sprint-plan/optimize:
    parameters:
    - $ref: '#/components/parameters/projectId'
    post:
      summary: Propose a sprint without changing the backlog or capacity
      description: Current project members including viewers can preview. CSRF is required.
        Existing commitments reserve capacity before evaluating backlog stories. Scenario overrides
        and locks apply only to this solve. CP-SAT has a two-second budget.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SprintPlanRequest' }
      responses:
        '200':
          description: Proposed stories or an explanation of infeasible locks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SprintPlanningProposal' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/projects/{projectId}/automation/rules:
    parameters:
    - $ref: '#/components/parameters/projectId'
    get:
      summary: List automation rules for an owner or administrator
      responses:
        '200':
          description: Up to 50 project rules, including disabled rules
          content:
            application/json:
              schema: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/AutomationRule' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a rule in an active project
      requestBody: { $ref: '#/components/requestBodies/AutomationRuleDraft' }
      responses:
        '201': { $ref: '#/components/responses/AutomationRuleSaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/projects/{projectId}/automation/rules/{ruleId}:
    parameters:
    - $ref: '#/components/parameters/projectId'
    - { name: ruleId, in: path, required: true, schema: { type: integer, format: int64 } }
    - $ref: '#/components/parameters/ifMatch'
    put:
      summary: Replace a rule at the named revision
      requestBody: { $ref: '#/components/requestBodies/AutomationRuleDraft' }
      responses:
        '200': { $ref: '#/components/responses/AutomationRuleSaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
    delete:
      summary: Remove a rule while preserving its run log
      responses:
        '204': { description: Rule deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /api/projects/{projectId}/automation/runs:
    parameters:
    - $ref: '#/components/parameters/projectId'
    get:
      summary: Read the most recent 100 rule outcomes as an owner or administrator
      responses:
        '200':
          description: Automation run log, newest first
          content:
            application/json:
              schema: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AutomationRun' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/projects/{projectId}/automation/github:
    parameters:
    - $ref: '#/components/parameters/projectId'
    get:
      summary: Read GitHub webhook settings without the secret
      responses:
        '200':
          description: GitHub webhook metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationGithubSettings' }
        '204': { description: No webhook configured }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: Create or rotate the project's inbound GitHub webhook
      description: Replaces the existing endpoint and secret. The new secret is returned once with Cache-Control no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository]
              properties:
                repository: { type: string, maxLength: 180, example: example-owner/example-repo }
      responses:
        '200':
          description: New webhook settings and one-time secret
          content:
            application/json:
              schema:
                type: object
                required: [settings, secret]
                properties:
                  settings: { $ref: '#/components/schemas/AutomationGithubSettings' }
                  secret: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      summary: Disconnect GitHub automation and invalidate its endpoint
      responses:
        '204': { description: Disconnected }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/automation/github/{endpointId}:
    post:
      summary: Accept a signed GitHub pull request event
      description: Authenticates the raw JSON body by HMAC-SHA-256. Valid events act only on the configured repository and referenced task keys.
      security: []
      parameters:
      - { name: endpointId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: X-GitHub-Event, in: header, required: true, schema: { type: string } }
      - { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        description: Original GitHub JSON body up to 1 MiB.
        content:
          application/json:
            schema: { type: object }
      responses:
        '204': { description: Delivery accepted or irrelevant to this trigger }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SPRINTFLOW_SESSION
  parameters:
    organizationSlug:
      in: path
      name: slug
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,78}[a-z0-9]$' }
    organizationUserId:
      in: path
      name: userId
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    sharedTextTarget:
      in: path
      name: target
      required: true
      schema: { type: string, enum: [TASK, RETROSPECTIVE] }
    exportStatus:
      in: query
      name: status
      schema: { type: string, enum: ['To Do', 'In Progress', 'Review', 'Done'] }
    exportSprint:
      in: query
      name: sprint
      schema: { type: string, enum: [backlog] }
    exportAssignee:
      in: query
      name: assignee
      schema: { type: string, description: 'Project member email or unassigned', maxLength: 320 }
    exportDue:
      in: query
      name: due
      schema: { type: string, enum: [overdue, has-date, no-date] }
    exportBlocked:
      in: query
      name: blocked
      schema: { type: boolean }
    exportLabel:
      in: query
      name: label
      schema: { type: string, maxLength: 32 }
    exportQ:
      in: query
      name: q
      schema: { type: string, maxLength: 1000 }
    ifMatch:
      in: header
      name: If-Match
      required: true
      description: Quoted current entity version; missing returns 428, stale returns 412.
      schema: { type: string, example: '"0"' }
    page:
      in: query
      name: page
      description: Optional zero-based page. Omit to retrieve the complete accessible list.
      schema: { type: integer, minimum: 0 }
    size:
      in: query
      name: size
      description: Number of items when page is supplied.
      schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
    id:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64 }
    projectId:
      in: path
      name: projectId
      required: true
      schema: { type: integer, format: int64 }
    taskId:
      in: path
      name: taskId
      required: true
      schema: { type: integer, format: int64 }
  requestBodies:
    AutomationRuleDraft:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, source, enabled]
            properties:
              name: { type: string, minLength: 1, maxLength: 80 }
              source: { type: string, minLength: 1, maxLength: 4096 }
              enabled: { type: boolean }
  responses:
    AutomationRuleSaved:
      description: The saved rule and its current revision
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AutomationRule' }
    RateLimited:
      description: >-
        Rate limit reached. Credential endpoints are limited per client address (fixed refill);
        every other write is limited per account (300/min, smooth refill; uploads 30/min).
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema: { type: integer, minimum: 1 }
        RateLimit-Limit:
          description: Bucket capacity for the applied policy.
          schema: { type: integer }
        RateLimit-Remaining:
          description: Tokens left after this request.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Error:
      description: >-
        RFC 9457 problem document. Branch on `code` (or `type`), never on the human-readable text.
      headers:
        Retry-After:
          description: Present for SERVICE_UNAVAILABLE database failures; seconds before retrying.
          schema: { type: integer, minimum: 1, example: 5 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    SecondFactorRequired:
      type: object
      required: [secondFactorRequired]
      properties:
        secondFactorRequired: { type: boolean, enum: [true] }
    TwoFactorStatus:
      type: object
      required: [enabled, recoveryCodesRemaining, requiredByOrganization]
      properties:
        enabled: { type: boolean }
        recoveryCodesRemaining: { type: integer, minimum: 0, maximum: 10 }
        requiredByOrganization: { type: boolean }
    TwoFactorPassword:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password, maxLength: 72, writeOnly: true }
    TwoFactorCode:
      type: object
      required: [code]
      properties:
        code: { type: string, maxLength: 32, writeOnly: true }
    TwoFactorPasswordAndCode:
      allOf:
        - { $ref: '#/components/schemas/TwoFactorPassword' }
        - { $ref: '#/components/schemas/TwoFactorCode' }
    TwoFactorSetup:
      type: object
      required: [secret, uri]
      properties:
        secret: { type: string, description: Base32 authenticator setup key. }
        uri: { type: string, format: uri, description: Local authenticator configuration URI. }
    TwoFactorRecovery:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string }
    OrganizationTwoFactorPolicy:
      type: object
      required: [requireTwoFactor]
      properties:
        requireTwoFactor: { type: boolean }
    Organization:
      type: object
      required: [id, slug, name, role, personal]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        name: { type: string }
        role: { type: string, enum: [Owner, Admin, Member, Viewer] }
        personal: { type: boolean }
    OrganizationRequest:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,78}[a-z0-9]$' }
        name: { type: string, maxLength: 120 }
    OrganizationMember:
      type: object
      required: [userId, email, name, role]
      properties:
        userId: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string, nullable: true }
        role: { type: string, enum: [Owner, Admin, Member, Viewer] }
    OrganizationRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [Admin, Member, Viewer] }
    OrganizationOwnership:
      type: object
      required: [userId]
      properties:
        userId: { type: integer, format: int64, minimum: 1 }
    OrganizationNameRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
    OrganizationTeam:
      type: object
      required: [id, name, memberCount]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        memberCount: { type: integer, minimum: 0 }
    OrganizationInviteRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        role: { type: string, enum: [Admin, Member, Viewer] }
    OrganizationInvitation:
      type: object
      required: [id, email, role, expiresAt]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        role: { type: string, enum: [Admin, Member, Viewer] }
        expiresAt: { type: string, format: date-time }
    IssuedOrganizationInvitation:
      type: object
      required: [invitation, token]
      properties:
        invitation: { $ref: '#/components/schemas/OrganizationInvitation' }
        token: { type: string, description: Single-use invitation secret returned once. }
    AcceptOrganizationInvitation:
      type: object
      required: [token]
      properties:
        token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    OrganizationTemplateRequest:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, maxLength: 120 }
        kind: { type: string, enum: [Blank, Scrum, Kanban] }
        description: { type: string, maxLength: 255 }
    OrganizationTemplate:
      type: object
      required: [id, name, kind, description]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string, enum: [Blank, Scrum, Kanban] }
        description: { type: string, nullable: true }
    AutomationRule:
      type: object
      required: [id, name, source, trigger, enabled, version, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 80 }
        source: { type: string, maxLength: 4096 }
        trigger: { $ref: '#/components/schemas/AutomationTrigger' }
        enabled: { type: boolean }
        version: { type: integer, format: int64, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    AutomationTrigger:
      type: string
      enum: [TASK_MOVED, PULL_REQUEST_MERGED, OVERDUE]
    AutomationRun:
      type: object
      required: [id, ruleId, ruleName, taskId, taskKey, trigger, outcome, detail, executedAt]
      properties:
        id: { type: integer, format: int64 }
        ruleId: { type: integer, format: int64 }
        ruleName: { type: string }
        taskId: { type: integer, format: int64 }
        taskKey: { type: string, nullable: true }
        trigger: { $ref: '#/components/schemas/AutomationTrigger' }
        outcome: { type: string, enum: [APPLIED, SKIPPED, FAILED] }
        detail: { type: string }
        executedAt: { type: string, format: date-time }
    AutomationGithubSettings:
      type: object
      required: [endpointId, repository, createdAt]
      properties:
        endpointId: { type: string, format: uuid }
        repository: { type: string }
        createdAt: { type: string, format: date-time }
    SharedTextSnapshot:
      type: object

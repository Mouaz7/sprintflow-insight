    ProjectRequest:
      type: object
      description: Client-settable project fields. The owner is always the signed-in user.
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 255, nullable: true }
        key:
          type: string
          nullable: true
          pattern: '^\s*[A-Za-z]{2,10}\s*$'
          description: >-
            Project key, stored upper case (e.g. SF). On create it is derived from the name when
            omitted (initials, collisions resolved with a letter suffix); on update omission keeps
            the current key. A key in use answers 409 CONFLICT. Changing it renames every task
            identifier of the project; numbers stay.
    Project:
      type: object
      required: [id, name, key, ownerEmail, version]
      properties:
        organizationId: { type: integer, format: int64 }
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string, nullable: true }
        key: { type: string, pattern: '^[A-Z]{2,10}$', example: SF }
        ownerEmail: { type: string, format: email }
        version: { type: integer, format: int64 }
        archivedAt: { type: string, format: date-time, nullable: true }
        trashedAt: { type: string, format: date-time, nullable: true }
    SearchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }
        nextCursor:
          type: string
          nullable: true
          description: Pass as cursor for the next page; null on the last page.
    SearchHit:
      type: object
      required: [type, id, projectId, projectKey, projectName, title, titleSegments, snippet, exactMatch]
      properties:
        type: { type: string, enum: [epic, task, story, sprint, comment, project] }
        id: { type: integer, format: int64, description: Id of the matched item; for a comment the comment id. }
        projectId: { type: integer, format: int64 }
        projectKey: { type: string, example: SF }
        projectName: { type: string }
        taskId: { type: integer, format: int64, nullable: true, description: The task to open for task and comment hits. }
        key: { type: string, nullable: true, example: SF-123, description: Task key for task and comment hits. }
        title: { type: string, description: Title or name; for a comment its task's title. }
        titleSegments:
          type: array
          items: { $ref: '#/components/schemas/SearchSegment' }
        snippet:
          type: array
          description: A short extract of the body; empty when the item has no body.
          items: { $ref: '#/components/schemas/SearchSegment' }
        exactMatch: { type: boolean, description: True when the query was exactly this task's key. }
    SearchSegment:
      type: object
      description: Plain text; match marks words that matched the query. Never markup.
      required: [text, match]
      properties:
        text: { type: string }
        match: { type: boolean }
    Task:
      type: object
      description: A task as returned by the API. number, projectKey and key are server owned.
      required: [id, title, status, projectId, number, key]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        status: { type: string, enum: [To Do, In Progress, Review, Done] }
        projectId: { type: integer, format: int64 }
        number:
          type: integer
          minimum: 1
          description: Per-project sequence number, allocated once and never reused.
        projectKey: { type: string, example: SF }
        key: { type: string, example: SF-123, description: 'Human identifier: projectKey-number.' }
        estimateMinutes: { type: integer, minimum: 0, maximum: 600000, nullable: true, readOnly: true, description: Changed through the time-estimate endpoint using the task revision. }
        version: { type: integer, format: int64 }
    StoryRequest:
      type: object
      description: Client-settable story fields. Backlog position changes only through the order endpoint.
      required: [title, acceptanceCriteria, projectId]
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 255, nullable: true }
        acceptanceCriteria: { type: string, maxLength: 255 }
        storyPoints: { type: integer, enum: [1, 2, 3, 5, 8] }
        priorityId: { type: integer, minimum: 1, maximum: 3 }
        businessValue: { type: integer, minimum: 1, maximum: 5, nullable: true }
        projectId: { type: integer, format: int64 }
        sprintId: { type: integer, format: int64, nullable: true }
    SprintRequest:
      type: object
      required: [name, status, projectId, startDate, endDate]
      properties:
        name: { type: string, maxLength: 255 }
        goal: { type: string, maxLength: 255, nullable: true }
        status: { type: string, enum: [Planned, Active, Completed, Cancelled] }
        totalStoryPoints: { type: integer, minimum: 0 }
        projectId: { type: integer, format: int64 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    TaskRequest:
      type: object
      description: >-
        Client-settable task fields. Ids, versions, timestamps and recycle-bin state are
        ignored if sent, so they cannot be mass-assigned.
      required: [title, status, projectId]
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 255, nullable: true }
        status: { type: string, enum: [To Do, In Progress, Review, Done] }
        blocked: { type: boolean }
        blockReason: { type: string, maxLength: 255, nullable: true }
        projectId: { type: integer, format: int64 }
        sprintId: { type: integer, format: int64, nullable: true }
        storyId: { type: integer, format: int64, nullable: true }
        assigneeEmail: { type: string, maxLength: 255, nullable: true }
        storyPoints: { type: integer, minimum: 0, maximum: 1000 }
        dueAt: { type: string, format: date-time, nullable: true }
        labels: { type: array, maxItems: 12, items: { type: string, maxLength: 32 } }
        checklist:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string, maxLength: 80 }
              label: { type: string, maxLength: 180 }
              completed: { type: boolean }
              required: { type: boolean }
    PreferencesRequest:
      type: object
      description: Partial update; omitted fields keep their stored value.
      properties:
        language: { type: string, enum: [EN, SV] }
        theme: { type: string, enum: [light, dark] }
        notifications: { type: boolean }
        onboardingCompleted: { type: boolean }
        savedFilters:
          type: string
          maxLength: 30000
          description: JSON array (max 30) of objects with non-blank `id` and `name` (max 80 characters).
    RealtimeMessage:
      type: object
      description: Names what changed, never its content. Clients reload the entity through the REST API.
      required: [projectId, seq, type]
      properties:
        projectId: { type: integer, format: int64 }
        seq: { type: integer, format: int64, description: Strictly increasing per project }
        type:
          type: string
          example: TaskMoved
          description: TaskCreated, TaskMoved, TaskUpdated, TaskDeleted, CommentAdded, CommentUpdated, CommentDeleted, SprintStatusChanged, NotificationsChanged, or an aggregate activity event such as STORY_DELETED.
        entityId: { type: integer, format: int64, nullable: true, description: Entity id according to type (task/sprint/story/project); comment events identify the task and notification events have no entity id. }
        version: { type: integer, format: int64, nullable: true, description: Entity version after the change; null when deleted or unknown }
    RealtimeEventPage:
      type: object
      required: [projectId, latestSeq, resync, events]
      properties:
        projectId: { type: integer, format: int64 }
        latestSeq: { type: integer, format: int64, description: Newest sequence number, 0 before the first message }
        resync: { type: boolean, description: The range is incomplete; reload the project and continue from latestSeq }
        events:
          type: array
          items: { $ref: '#/components/schemas/RealtimeMessage' }
    OpenTaskPresenceRequest:
      type: object
      properties:
        taskId: { type: integer, format: int64, minimum: 1, nullable: true, description: Null clears the open task. }
    PresenceMessage:
      type: object
      required: [projectId, viewers]
      properties:
        projectId: { type: integer, format: int64 }
        viewers:
          type: array
          items:
            type: object
            required: [userId, name, taskIds]
            properties:
              userId: { type: integer, format: int64 }
              name: { type: string, description: Display name only; never email. }
              taskIds:
                type: array
                items: { type: integer, format: int64 }
    Problem:
      type: object
      required: [type, title, status, detail, code, message]
      properties:
        type:
          type: string
          format: uri
          description: Stable problem type, `https://sprintflow.dev/problems/<kebab-case code>`.
          example: https://sprintflow.dev/problems/validation-failed
        title: { type: string, example: Validation failed }
        status: { type: integer, example: 400 }
        detail: { type: string, description: Human-readable explanation for this occurrence. }
        instance: { type: string, description: Request path that failed. }
        code:
          type: string
          enum: [MALFORMED_REQUEST, VALIDATION_FAILED, INVALID_PARAMETER, MISSING_PARAMETER, BAD_REQUEST, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, NOT_ACCEPTABLE, CONFLICT, GONE, PRECONDITION_FAILED, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, PRECONDITION_REQUIRED, RATE_LIMITED, INTERNAL_ERROR, SERVICE_UNAVAILABLE]
        message: { type: string, description: Same text as `detail`; kept for older clients. }
        errors:
          type: array
          description: Present for VALIDATION_FAILED.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        cycle:
          type: array
          description: Present for a dependency-cycle CONFLICT; task IDs in traversal order with the first repeated at the end.
          items: { type: integer, format: int64 }
        cycleKeys:
          type: array
          description: The same scoped cycle as human task keys, suitable for plain-text feedback.
          items: { type: string }
        errorId: { type: string, description: Present for INTERNAL_ERROR; quote it when reporting a problem. }
    Registration:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6, maxLength: 72 }
        displayName: { type: string, minLength: 1, maxLength: 80 }

    DashboardWidget:
      type: object
      required: [type, wide]
      properties:
        type: { type: string, enum: [BURNDOWN, CFD, FORECAST, WIP, MY_TASKS, SPRINT_GOAL] }
        wide: { type: boolean }
    DashboardLayoutRequest:
      type: object
      required: [widgets]
      properties:
        widgets:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/DashboardWidget' }
    DashboardLayout:
      type: object
      required: [version, widgets]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        widgets:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/DashboardWidget' }

    DigestPreferenceRequest:
      type: object
      required: [frequency, timeZone]
      properties:
        frequency: { type: string, enum: ['OFF', DAILY, WEEKLY] }
        timeZone: { type: string, minLength: 1, maxLength: 64, example: Europe/Stockholm }
    DigestPreference:
      type: object
      required: [frequency, timeZone, nextDueAt, lastSentAt, version, mailConfigured]
      properties:
        frequency: { type: string, enum: ['OFF', DAILY, WEEKLY] }
        timeZone: { type: string }
        nextDueAt: { type: string, format: date-time, nullable: true }
        lastSentAt: { type: string, format: date-time, nullable: true }
        version: { type: integer, format: int64, minimum: 0 }
        mailConfigured: { type: boolean }
    DigestUnsubscribeRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 2048 }

    CommentRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 1000, description: Nonblank comment with optional project-member handles }
        version: { type: integer, format: int64, nullable: true }
    ImportFormat:
      type: string
      enum: [CSV, JIRA_JSON]
    ImportRequest:
      type: object
      required: [format, content, mapping, statuses]
      properties:
        format: { $ref: '#/components/schemas/ImportFormat' }
        content: { type: string, minLength: 1, maxLength: 1000000 }
        mapping: { type: object, maxProperties: 32, additionalProperties: { type: string, maxLength: 160 }, description: Task targets or custom colon field id mapped to source column names; empty means automatic mapping. }
        statuses: { type: object, maxProperties: 40, additionalProperties: { type: string, enum: ['To Do', 'In Progress', Review, Done] } }
        truncateText: { type: boolean, default: false }
        preserveHistory: { type: boolean, default: false }
        expectedFingerprint: { type: string, nullable: true, pattern: '^[a-f0-9]{64}$' }
    ImportRow:
      type: object
      properties:
        rowNumber: { type: integer }
        title: { type: string }
        description: { type: string }
        status: { type: string }
        sourceStatus: { type: string }
        storyPoints: { type: integer }
        assigneeEmail: { type: string, nullable: true }
        labels: { type: array, items: { type: string } }
        dueAt: { type: string, format: date-time, nullable: true }
        sourceKey: { type: string, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        customValues: { type: object, additionalProperties: { type: string } }
        errors: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        duplicate: { type: boolean }
    ImportPreview:
      type: object
      properties:
        format: { $ref: '#/components/schemas/ImportFormat' }
        columns: { type: array, items: { type: string } }
        mapping: { type: object, additionalProperties: { type: string } }
        rows: { type: array, items: { $ref: '#/components/schemas/ImportRow' } }
        fingerprint: { type: string }
        createCount: { type: integer }
        skipCount: { type: integer }
        canCommit: { type: boolean }
        previousBatchId: { type: string, format: uuid, nullable: true }
    ImportResult:
      type: object
      properties:
        batchId: { type: string, format: uuid }
        createdCount: { type: integer }
        skippedCount: { type: integer }
        taskIds: { type: array, items: { type: integer, format: int64 } }
        replayed: { type: boolean }
    ImportBatch:
      type: object
      properties:
        id: { type: string, format: uuid }
        format: { type: string }
        createdCount: { type: integer }
        skippedCount: { type: integer }
        createdAt: { type: string, format: date-time }
    AuditEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64, nullable: true }
        actorUserId: { type: integer, format: int64 }
        actorRole: { type: string, enum: [Owner, Admin, Member, Account] }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string, nullable: true }
        details: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    AuditPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        nextBefore: { type: integer, format: int64, nullable: true }
    SprintPlanRequest:
      type: object
      required: [sprintId, unit, memberCapacities, lockedIn, lockedOut]
      properties:
        sprintId: { type: integer, format: int64, minimum: 1 }
        unit: { type: string, enum: [HOURS, POINTS] }
        totalCapacity: { type: integer, nullable: true, minimum: 0, maximum: 1000000 }
        memberCapacities:
          type: object
          maxProperties: 100
          description: Optional effective capacities keyed by current working member user ID.
          additionalProperties: { type: integer, minimum: 0, maximum: 1000000 }
        lockedIn: { type: array, maxItems: 200, uniqueItems: true, items: { type: integer, format: int64, minimum: 1 } }
        lockedOut: { type: array, maxItems: 200, uniqueItems: true, items: { type: integer, format: int64, minimum: 1 } }
    SprintPlanningOptions:
      type: object
      properties:
        sprintId: { type: integer, format: int64 }
        unit: { type: string, enum: [HOURS, POINTS] }
        configuredCapacity: { type: integer }
        reservedEffort: { type: integer }
        unestimatedCommitments: { type: integer }
        members:
          type: array
          items:
            type: object
            properties:
              userId: { type: integer, format: int64 }
              email: { type: string }
              configuredCapacity: { type: integer }
              reservedEffort: { type: integer }
        stories:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              title: { type: string }
              value: { type: integer }
              effort: { type: integer }
              assignedEffort: { type: object, additionalProperties: { type: integer } }
              eligibility: { type: string, enum: [READY, MISSING_ESTIMATE, HAS_SCHEDULED_TASK] }
    SprintPlanningProposal:
      type: object
      properties:
        options: { $ref: '#/components/schemas/SprintPlanningOptions' }
        plan:
          type: object
          properties:
            solver: { type: string, enum: [CP_SAT] }
            status: { type: string, enum: [OPTIMAL, FEASIBLE, UNKNOWN, INFEASIBLE] }
            selectedStoryIds: { type: array, items: { type: string } }
            objective: { type: integer, format: int64 }
            bestBound: { type: integer, format: int64, nullable: true }
            relativeGap: { type: number, nullable: true }
            wallTime: { type: string }
            explanation:
              type: object
              properties:
                resources:
                  type: array
                  items:
                    type: object
                    properties:
                      resource: { type: string }
                      used: { type: integer, format: int64 }
                      available: { type: integer, format: int64 }
                      binding: { type: boolean }
                excluded:
                  type: array
                  items:
                    type: object
                    properties:
                      storyId: { type: string }
                      reason: { type: string, enum: [LOCKED_OUT, MISSING_DEPENDENCY, CAPACITY, LOWER_VALUE_DENSITY, NO_ADDED_VALUE, NOT_REACHED, PLAN_INFEASIBLE] }
                      relatedStoryIds: { type: array, items: { type: string } }
                      resources: { type: array, items: { type: string } }
                conflicts:
                  type: array
                  items:
                    type: object
                    properties:
                      kind: { type: string, enum: [LOCKED_IN_BLOCKED, LOCKED_IN_OVER_CAPACITY] }
                      storyIds: { type: array, items: { type: string } }
                      relatedStoryIds: { type: array, items: { type: string } }
                      resource: { type: string, nullable: true }

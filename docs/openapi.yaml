          format: date-time
        cycleTimeHours:
          type: number
          format: double
        movingRange:
          type: number
          format: double
          nullable: true
        signals:
          type: array
          items:
            type: string
            enum:
            - OUTSIDE_LIMITS
            - TWO_OF_THREE_BEYOND_TWO_SIGMA
            - FOUR_OF_FIVE_BEYOND_ONE_SIGMA
            - RUN_OF_EIGHT
            - LARGE_MOVING_RANGE
    FlowControlChart:
      type: object
      required:
      - available
      - minimumPoints
      - mean
      - upperLimit
      - lowerLimit
      - movingRangeMean
      - upperRangeLimit
      - signalCount
      - points
      properties:
        available:
          type: boolean
        minimumPoints:
          type: integer
          format: int64
          minimum: 0
        mean:
          type: number
          format: double
          nullable: true
        upperLimit:
          type: number
          format: double
          nullable: true
        lowerLimit:
          type: number
          format: double
          nullable: true
        movingRangeMean:
          type: number
          format: double
          nullable: true
        upperRangeLimit:
          type: number
          format: double
          nullable: true
        signalCount:
          type: integer
          format: int64
          minimum: 0
        points:
          type: array
          items:
            $ref: '#/components/schemas/FlowControlPoint'
      description: 'Retrospective descriptive XmR with six measured completions minimum. Limits use the whole
        window, not a pre-calibrated baseline; signals do not prove statistical control or a special cause.
        Individual limits: mean ±3 MR/1.128; MR upper3.267 MR. Lower individual limit clamped to zero for
        display only. See ADR0020.'
    FlowLittlesLaw:
      type: object
      required:
      - status
      - averageWip
      - throughputPerDay
      - averageCycleTimeDays
      - expectedWip
      - ratio
      - tolerance
      properties:
        status:
          type: string
          enum:
          - CONSISTENT
          - INCONSISTENT
          - INSUFFICIENT_DATA
        averageWip:
          type: number
          format: double
        throughputPerDay:
          type: number
          format: double
        averageCycleTimeDays:
          type: number
          format: double
        expectedWip:
          type: number
          format: double
        ratio:
          type: number
          format: double
          nullable: true
        tolerance:
          type: number
          format: double
      description: Heuristic boundary/history review, not a statistical test. Compares time-averaged active
        WIP with measured-cycle completion rate times mean active-cycle duration. Minimum5 measured completions;
        ratio0.80–1.25 accepted. Finite-window censoring, reopening and changing demand can explain mismatches
        without corrupt data.
    TaskDuplicateMatch:
      type: object
      required: [taskId, key, title, status, score]
      properties:
        taskId: { type: integer, format: int64 }
        key: { type: string }
        title: { type: string }
        status: { type: string }
        score: { type: number, format: double, minimum: 0.35, maximum: 1 }
    ProjectFlowSignals:
      type: object
      required: [firstMonitoredDay, inflow, throughput]
      properties:
        firstMonitoredDay: { type: string, format: date, nullable: true }
        inflow:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/FlowSignalChart' }]
        throughput:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/FlowSignalChart' }]
    FlowSignalChart:
      type: object
      required: [baselineMean, monitoring]
      properties:
        baselineMean: { type: number, format: double, minimum: 0 }
        monitoring:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: object
            required: [observed, weighted, lower, upper, signal]
            properties:
              observed: { type: integer, minimum: 0 }
              weighted: { type: number, format: double, minimum: 0 }
              lower: { type: number, format: double, minimum: 0 }
              upper: { type: number, format: double, minimum: 0 }
              signal: { type: string, enum: [LOW, IN_LIMITS, HIGH] }
    FlowResponse:

openapi: 3.0.3
info:
  title: SprintFlow REST API
  version: 1.0.0
  description: >-
    Same-origin REST API for the React and TypeScript client. Authenticated requests use a
    server-managed SPRINTFLOW_SESSION session. State-changing requests also require the CSRF header
    returned by GET /api/auth/csrf. Authentication and recovery POST requests are limited
    per client IP and endpoint over one minute. A rejected request returns 429 and Retry-After.
    Database connection failures before the response is committed return a 503 SERVICE_UNAVAILABLE
    problem with Retry-After set to 5 seconds, including failures loading or saving the JDBC session.
servers:
  - url: http://localhost:8081
security:
  - sessionCookie: []
x-stomp:
  endpoint: /ws
  authentication: Session cookie, allowed Origin and X-CSRF-TOKEN in CONNECT
  subscribe:
    - /topic/projects/{projectId}
    - /topic/projects/{projectId}/presence
  send:
    destination: /app/projects/{projectId}/presence
    schema: '#/components/schemas/OpenTaskPresenceRequest'
    description: READ membership and an existing project subscription required; task must belong to this project and be outside the recycle bin. Other SEND destinations are denied.
paths:
  /actuator/health:
    get:
      security: []
      summary: Read minimal application and database health
      responses:
        '200': { description: Healthy, status UP without details }
        '503': { description: Unhealthy, status DOWN without details }
  /api/auth/csrf:
    get:
      security: []
      summary: Get the session CSRF token and header name
      responses:
        '200': { description: CSRF token }
  /api/auth/register:
    post:
      security: []
      summary: Register a user and create a server session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Registration' }
      responses:
        '429': { $ref: '#/components/responses/RateLimited' }
        '200': { description: User and authenticated session }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/auth/login:
    post:
      security: []
      summary: Sign in and create a server session
      responses:
        '429': { $ref: '#/components/responses/RateLimited' }
        '200': { description: User and authenticated session }
        '202':
          description: Complete the second factor using the pending session and a fresh CSRF token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecondFactorRequired' }
        '401': { $ref: '#/components/responses/Error' }
  /api/auth/two-factor:
    get:
      summary: Read the signed-in account's two-factor status
      responses:
        '200':
          description: Enrollment, remaining codes and organization requirement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/auth/two-factor/setup:
    post:
      summary: Create a short-lived encrypted authenticator setup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorPassword' }
      responses:
        '200':
          description: Authenticator secret and URI for local QR rendering
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorSetup' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/auth/two-factor/enable:
    post:
      summary: Enable TOTP after verifying the current password and a code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorPasswordAndCode' }
      responses:
        '200':
          description: Ten single-use recovery codes returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorRecovery' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/auth/two-factor/disable:
    post:
      summary: Disable TOTP with the current password and an available second factor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorPasswordAndCode' }
      responses:
        '204': { description: Two-factor authentication disabled }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/auth/two-factor/verify:
    post:
      security: []
      summary: Finish sign-in using a session-bound TOTP or recovery code
      description: A first-factor request must have created a pending cookie. Fetch a fresh CSRF token before verification. Challenge and account rate limits apply.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorCode' }
      responses:
        '200': { description: User and authenticated session }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/auth/logout:
    post:
      summary: Invalidate the current session
      responses:
        '204': { description: Signed out }
  /api/auth/me:
    get:
      summary: Return the signed-in user
      responses:
        '200':
          description: Current user. Includes mfaEnrollmentRequired when the account must enroll to open its workspace.
        '401': { $ref: '#/components/responses/Error' }
  /api/auth/profile:
    put:
      summary: Update the signed-in profile
      responses:
        '200': { description: Updated profile }
        '400': { $ref: '#/components/responses/Error' }
  /api/auth/password/change:
    post:
      summary: Change the current password
      responses:
        '200': { description: Password changed }
        '401': { $ref: '#/components/responses/Error' }
  /api/auth/password/reset/request:
    post:
      security: []
      summary: Request an email password reset
      responses:
        '429': { $ref: '#/components/responses/RateLimited' }
        '200': { description: Request accepted }
        '503': { $ref: '#/components/responses/Error' }
  /api/auth/password/reset/available:
    get:
      security: []
      summary: Check whether email password recovery is configured
      responses: { '200': { description: Availability } }
  /api/auth/password/reset/recovery:
    post:
      security: []
      summary: Reset a password with a recovery code
      responses:
        '429': { $ref: '#/components/responses/RateLimited' }
        '200': { description: Password reset }
        '400': { $ref: '#/components/responses/Error' }
  /api/auth/password/reset/confirm:
    post:
      security: []
      summary: Confirm an email password reset token
      responses:
        '429': { $ref: '#/components/responses/RateLimited' }
        '200': { description: Password reset }
        '400': { $ref: '#/components/responses/Error' }
  /api/auth/google/config:
    get:
      security: []
      summary: Get Google sign-in configuration
      responses: { '200': { description: Configuration } }
  /api/auth/google:
    post:
      security: []
      summary: Sign in with a verified Google identity token
      responses:
        '429': { $ref: '#/components/responses/RateLimited' }
        '200': { description: User and authenticated session }
        '202':
          description: Complete the second factor using the pending session and a fresh CSRF token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecondFactorRequired' }
        '401': { $ref: '#/components/responses/Error' }
  /api/auth/account:
    delete:
      summary: Delete the signed-in account after ownership is resolved
      responses:
        '200': { description: Account deleted }
        '409': { $ref: '#/components/responses/Error' }
  /api/organizations:
    get:
      summary: List organizations for the signed-in account
      responses:
        '200':
          description: Current organization data
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Organization' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: Create an organization with a unique URL slug
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationRequest' }
      responses:
        '201':
          description: Organization data created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/organizations/{slug}/projects:
    parameters:
      - { $ref: '#/components/parameters/organizationSlug' }
    get:
      summary: List projects visible to the account in this organization
      responses:
        '200':
          description: Current organization data
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Project' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a project in this organization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectRequest' }
      responses:
        '201':
          description: Organization data created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/organizations/{slug}/members:
    parameters:
      - { $ref: '#/components/parameters/organizationSlug' }
    get:
      summary: List organization members and roles
      responses:
        '200':
          description: Current organization data
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/OrganizationMember' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/organizations/{slug}/members/{id}:
    parameters:
      - { $ref: '#/components/parameters/organizationSlug' }
      - { $ref: '#/components/parameters/id' }
    put:
      summary: Change an organization member role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationRoleRequest' }
      responses:
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      summary: Remove an organization member and their team assignments
      responses:
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/organizations/{slug}/ownership:
    parameters:
      - { $ref: '#/components/parameters/organizationSlug' }
    put:
      summary: Transfer ownership of a shared organization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationOwnership' }
      responses:
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/organizations/{slug}/teams:
    parameters:
      - { $ref: '#/components/parameters/organizationSlug' }
    get:
      summary: List teams in the organization
      responses:
        '200':
          description: Current organization data
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/OrganizationTeam' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationNameRequest' }
      responses:
        '201':
          description: Organization data created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationTeam' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/organizations/{slug}/teams/{id}:
    parameters:
      - { $ref: '#/components/parameters/organizationSlug' }
      - { $ref: '#/components/parameters/id' }
    put:
      summary: Rename a team
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationNameRequest' }
      responses:
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete a team and its assignments
      responses:
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/organizations/{slug}/teams/{id}/members:
    parameters:
      - { $ref: '#/components/parameters/organizationSlug' }
      - { $ref: '#/components/parameters/id' }
    get:
      summary: List team members
      responses:
        '200':
          description: Current organization data
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/OrganizationMember' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/organizations/{slug}/teams/{id}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/organizationSlug' }
      - { $ref: '#/components/parameters/id' }
      - { $ref: '#/components/parameters/organizationUserId' }
    put:
      summary: Add an organization member to a team
      responses:
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      summary: Remove a member from a team
      responses:
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/organizations/{slug}/invites:
    parameters:
      - { $ref: '#/components/parameters/organizationSlug' }
    get:
      summary: List active invitations for an owner or admin
      responses:
        '200':
          description: Current organization data
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/OrganizationInvitation' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: Issue a single-use email-bound invitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationInviteRequest' }
      responses:
        '201':
          description: Organization data created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedOrganizationInvitation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/organizations/{slug}/invites/{id}:
    parameters:
      - { $ref: '#/components/parameters/organizationSlug' }
      - { $ref: '#/components/parameters/id' }
    delete:
      summary: Revoke an invitation
      responses:
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/organizations/{slug}/invites/accept:
    parameters:
      - { $ref: '#/components/parameters/organizationSlug' }
    post:
      summary: Join the organization using an invitation for the current account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptOrganizationInvitation' }
      responses:
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/organizations/{slug}/templates:
    parameters:
      - { $ref: '#/components/parameters/organizationSlug' }
    get:
      summary: List organization project templates
      responses:
        '200':
          description: Current organization data
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/OrganizationTemplate' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: Save a reusable project starter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationTemplateRequest' }
      responses:
        '201':
          description: Organization data created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationTemplate' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/organizations/{slug}/templates/{id}:
    parameters:
      - { $ref: '#/components/parameters/organizationSlug' }
      - { $ref: '#/components/parameters/id' }
    delete:
      summary: Delete an organization template
      responses:
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/organizations/{slug}/templates/{id}/projects:
    parameters:
      - { $ref: '#/components/parameters/organizationSlug' }
      - { $ref: '#/components/parameters/id' }
    post:
      summary: Create a project from an organization template
      parameters:
        - in: query
          name: language
          schema: { type: string, enum: [EN, SV], default: EN }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectRequest' }
      responses:
        '201':
          description: Organization data created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/organizations/{slug}/security:
    parameters:
      - { $ref: '#/components/parameters/organizationSlug' }
    get:
      summary: Read the organization's two-factor requirement as owner or admin
      responses:
        '200':
          description: Current organization sign-in requirement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationTwoFactorPolicy' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: Change the organization's two-factor requirement as owner
      description: Enabling the requirement needs a verified two-factor session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationTwoFactorPolicy' }
      responses:
        '200':
          description: New organization sign-in requirement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationTwoFactorPolicy' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/projects:
    get:
      summary: List projects accessible to the signed-in user
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
      responses:
        '200': { description: Accessible projects }
    post:
      summary: Create a project owned by the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectRequest' }
      responses:
        '200':
          description: Created project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/projects/{id}:
    get:
      summary: Get an accessible project
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: Project details } }
    put:
      summary: Edit project details
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/ifMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectRequest' }
      responses:
        '200': { description: Updated project }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete a project and all its contents (owner only)
      description: Removes stories, sprints, tasks, comments, attachments, status history, activity, notifications and memberships in one transaction. Uploaded files are cleaned up after commit.
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '204': { description: Project deleted }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/projects/{id}/role:
    get:
      summary: Get the signed-in user's role in a project
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: Membership role } }
  /api/projects/{id}/members:
    get:
      summary: List project members
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: Project members } }
    post:
      summary: Add or update a registered member as Admin, Member or Viewer
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: Updated membership } }
  /api/projects/{id}/owner:
    put:
      summary: Transfer project ownership to a current member
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: Project with new owner } }
  /api/projects/{id}/members/{email}:
    delete:
      summary: Remove a member from a project
      parameters:
        - { $ref: '#/components/parameters/id' }
        - in: path
          name: email
          required: true
          schema: { type: string, format: email }
      responses:
        '204': { description: Member removed }
        '409': { $ref: '#/components/responses/Error' }
  /api/stories/project/{projectId}:
    get:
      summary: List user stories in an accessible project
      parameters: [{ $ref: '#/components/parameters/projectId' }]
      responses: { '200': { description: Project backlog } }
  /api/stories:
    post:
      summary: Create a user story and optionally assign it to a same-project sprint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoryRequest' }
      responses:
        '200': { description: Created story }
        '400': { $ref: '#/components/responses/Error' }
  /api/stories/project/{projectId}/order:
    put:
      summary: Persist the manual backlog order for an authorized writer
      description: Supply every active story exactly once with its observed version. Project locking makes the change atomic. Missing versions return 428, stale versions 412, and changed membership of the backlog or duplicate IDs 409. Foreign-project IDs are rejected.
      parameters: [{ $ref: '#/components/parameters/projectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [id, version]
                    properties:
                      id: { type: integer, format: int64 }
                      version: { type: integer, format: int64 }
      responses:
        '200': { description: Stories in their saved order with current versions }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /api/stories/{id}:
    get:
      summary: Get an accessible item and its current version
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: Item details } }
    put:
      summary: Update a user story
      description: Changing the sprint moves all linked tasks to the same sprint in the same transaction, including trashed tasks. Task versions advance and history records the new sprint.
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/ifMatch' }]
      responses: { '200': { description: Updated story } }
    delete:
      summary: Move a story and its active tasks to the recycle bin
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/ifMatch' }]
      responses: { '204': { description: Story deleted } }
  /api/sprints:
    get:
      summary: List accessible sprints
      parameters:
        - in: query
          name: projectId
          schema: { type: integer, format: int64 }
      responses: { '200': { description: Sprints } }
    post:
      summary: Create a dated sprint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SprintRequest' }
      responses: { '200': { description: Created sprint } }
  /api/sprints/{id}:
    put:
      summary: Update sprint details and schedule
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/ifMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SprintRequest' }
      responses: { '200': { description: Updated sprint } }
    delete:
      summary: Move a sprint and its active work to the recycle bin
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/ifMatch' }]
      responses: { '204': { description: Sprint deleted } }
  /api/sprints/{id}/status:
    put:
      summary: Change sprint lifecycle status
      parameters:
        - { $ref: '#/components/parameters/ifMatch' }
        - { $ref: '#/components/parameters/id' }
        - in: query
          name: status
          required: true
          schema: { type: string, enum: [Planned, Active, Completed, Cancelled] }
      responses: { '200': { description: Updated sprint } }
  /api/tasks:
    get:
      summary: List tasks in an accessible project
      parameters:
        - in: query
          name: projectId
          required: true
          schema: { type: integer, format: int64 }
      responses: { '200': { description: Project tasks } }
    post:
      summary: Create a task in a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskRequest' }
      responses:
        '200':
          description: Created task with its allocated identifier
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
  /api/tasks/by-key/{key}:
    get:
      summary: Get an accessible task by its identifier, e.g. SF-123
      description: >-
        Case-insensitive. Unknown or malformed keys, trashed tasks and projects the caller cannot
        read all answer 404 NOT_FOUND, so keys cannot be used to discover other projects.
      parameters:
        - in: path
          name: key
          required: true
          schema: { type: string, pattern: '^[A-Za-z]{2,10}-[1-9][0-9]{0,8}$', example: SF-123 }
      responses:
        '200':
          description: The task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/projects/{projectId}/custom-fields:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
    get:
      summary: List project custom field definitions, including archived projects, for any member
      responses:
        '200':
          description: Definitions ordered by id; at most 20
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CustomFieldDefinition' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: Owner/Admin creates a field in an active project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomFieldDefinitionRequest' }
      responses:
        '200': { description: Definition, content: { application/json: { schema: { $ref: '#/components/schemas/CustomFieldDefinition' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Archived project, duplicate name or limit reached }
  /api/projects/{projectId}/custom-fields/{fieldId}:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
      - in: path
        name: fieldId
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
      - in: header
        name: If-Match
        required: true
        description: Quoted current definition version
        schema: { type: string, example: '"0"' }
    put:
      summary: Owner/Admin renames a field or updates options in an active project
      description: Type is immutable. An option used by live or recycled tasks cannot be removed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomFieldDefinitionRequest' }
      responses:
        '200': { description: Updated definition, content: { application/json: { schema: { $ref: '#/components/schemas/CustomFieldDefinition' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Archive, duplicate name, type change or option still in use }
        '412': { description: Stale definition version }
        '428': { description: Missing If-Match }
    delete:
      summary: Owner/Admin deletes a definition and all its values in an active project
      responses:
        '204': { description: Definition and values removed }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Archived project }
        '412': { description: Stale definition version }
        '428': { description: Missing If-Match }
  /api/projects/{projectId}/custom-fields/matches:
    get:
      summary: Match live task ids with a typed field condition for any project reader
      description: B15 may reuse the same typed FieldCondition and pure matcher. Missing values match only IS_NOT_SET; CONTAINS treats percent and underscore literally.
      parameters:
        - { $ref: '#/components/parameters/projectId' }
        - in: query
          name: fieldId
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: operator
          required: true
          schema: { $ref: '#/components/schemas/CustomFieldOperator' }
        - in: query
          name: value
          schema: { type: string, maxLength: 200 }
      responses:
        '200': { description: Matching task ids, content: { application/json: { schema: { $ref: '#/components/schemas/CustomFieldMatches' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/tasks/{taskId}/custom-fields:
    parameters:
      - in: path
        name: taskId
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      summary: Read task values and the current task revision for any project reader
      responses:
        '200':
          description: Typed snapshot; decimals and member ids are strings
          headers: { ETag: { description: Quoted task version, schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskCustomFields' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: Owner/Admin/Member atomically replaces all task values in an active project
      description: Missing or empty entries clear values. Changed values increment the parent task version, unchanged canonical values do not. No status-history entry is created. USER values reference current project membership ids; removing membership clears the value.
      parameters:
        - in: header
          name: If-Match
          required: true
          description: Quoted current task version, shared with ordinary task editing
          schema: { type: string, example: '"0"' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomFieldValuesRequest' }
      responses:
        '200':
          description: Saved snapshot
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskCustomFields' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Archived project }
        '412': { description: Stale task version }
        '428': { description: Missing If-Match }
  /api/search:
    get:
      summary: Full-text search across the projects the caller can read
      description: >-
        Searches tasks, stories, epics, sprints, comments and projects with PostgreSQL full-text search
        (Swedish and English stemming, word prefixes) plus pg_trgm trigram similarity on titles for
        typos. Only members' projects are searched (any role, archived projects included, trashed
        projects and items excluded); the filter is part of the search statement. Hits are ordered by
        rank (ts_rank plus trigram similarity), then type, then id. A query that is exactly a task key
        such as SF-123 returns that task first with exactMatch true. Words are reduced to letters and
        digits; query operators are not interpreted. A query without letters or digits returns no hits.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 200, example: login bug }
        - in: query
          name: projectId
          description: Restrict to one project. Unknown or trashed projects answer 404, projects the caller is not a member of 403.
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: types
          description: Comma-separated or repeated. All types when absent.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 6
            items: { type: string, enum: [epic, task, story, sprint, comment, project] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: cursor
          description: Opaque nextCursor from the previous page (keyset pagination).
          schema: { type: string, maxLength: 100, pattern: '^[A-Za-z0-9_-]+$' }
        - in: query
          name: customFieldId
          description: Project custom field. Requires projectId in search; restricts hits to tasks.
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: customOperator
          schema: { $ref: '#/components/schemas/CustomFieldOperator' }
        - in: query
          name: customValue
          description: Exact string operand, required except IS_SET/IS_NOT_SET. Text is case-sensitive; unset values match only IS_NOT_SET.
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: One page of hits, best first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/tasks/{id}:
    get:
      summary: Get an accessible item and its current version
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: Item details } }
    put:
      summary: Update a task, including workflow status and associations
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/ifMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskRequest' }
      responses: { '200': { description: Updated task } }
    delete:
      summary: Move a task to the recycle bin
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/ifMatch' }]
      responses: { '204': { description: Task deleted } }
  /api/tasks/{id}/block:
    put:
      summary: Block a task with a required reason
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/ifMatch' }]
      responses: { '200': { description: Blocked task } }
  /api/tasks/{id}/unblock:
    put:
      summary: Remove a task blocker
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/ifMatch' }]
      responses: { '200': { description: Unblocked task } }
  /api/tasks/{taskId}/attachments:
    get:
      summary: List task attachments and links
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      responses: { '200': { description: Attachments } }
    post:
      summary: Add an HTTP or HTTPS link to a task
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      responses: { '200': { description: Created link } }
  /api/tasks/{taskId}/attachments/upload:
    post:
      summary: Upload a JPG, PNG, GIF, WebP or PDF file up to 15 MB
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses: { '200': { description: Uploaded file } }
  /api/tasks/{taskId}/attachments/{id}/file:
    get:
      summary: Download a task attachment
      parameters:
        - { $ref: '#/components/parameters/taskId' }
        - { $ref: '#/components/parameters/id' }
      responses: { '200': { description: Attachment bytes } }
  /api/tasks/{taskId}/attachments/{id}:
    delete:
      summary: Delete an attachment or link
      parameters:
        - { $ref: '#/components/parameters/taskId' }
        - { $ref: '#/components/parameters/id' }
      responses: { '204': { description: Attachment deleted } }
  /api/tasks/{taskId}/comments:
    get:
      summary: List task comments
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      responses: { '200': { description: Comments } }
    post:
      summary: Add a task comment with member mentions
      description: Up to 20 distinct @name or @full@email handles resolve only to current project members. Ambiguous short names, outsiders and closed backtick code spans do not notify. Self mentions are stored but do not notify the actor. Only newly added mention recipients are notified.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentRequest' }
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      responses: { '200': { description: Created comment } }
  /api/notifications:
    get:
      summary: List notifications for the signed-in user
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
      responses: { '200': { description: Notifications } }
  /api/notifications/{id}/read:
    put:
      summary: Mark a notification as read
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '204': { description: Notification updated } }
  /api/projects/{projectId}/events:
    get:
      summary: Realtime messages after a sequence number, for filling gaps after a reconnect
      description: >-
        Any project member (archived projects included). Live messages arrive over STOMP at /ws
        on /topic/projects/{projectId}; each carries the per-project sequence number seq. A client
        that sees a jump in seq, or reconnects, asks for the messages after the last seq it applied.
        The log keeps 7 days and at most 1000 messages per project. When the range is no longer
        complete or longer than 200 messages, resync is true, events is empty and the client
        reloads the project, then continues from latestSeq.
      parameters:
        - { $ref: '#/components/parameters/projectId' }
        - in: query
          name: after
          description: Last sequence number the client applied; 0 for none
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        '200':
          description: Missed messages in sequence order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealtimeEventPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/projects/{projectId}/collaboration/{target}/{id}:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
      - { $ref: '#/components/parameters/sharedTextTarget' }
      - { $ref: '#/components/parameters/id' }
    get:
      summary: Read shared text and recover missed collaboration revisions
      description: Project members can read a room, including in an archived project. The response includes a compressed snapshot when the requested revision predates the compacted prefix, followed by its update tail.
      parameters:
        - in: query
          name: after
          description: Last contiguous applied revision.
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        '200':
          description: Room state and missing frames
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedTextSnapshot' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: Initialize shared editing from the current text
      description: Requires CSRF and edit access to the item. Initializing an existing room returns its current state.
      responses:
        '200':
          description: Active room and its frames
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedTextSnapshot' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/projects/{projectId}/collaboration/{target}/{id}/metadata:
    get:
      summary: Check whether an item has an active shared editor
      parameters:
        - { $ref: '#/components/parameters/projectId' }
        - { $ref: '#/components/parameters/sharedTextTarget' }
        - { $ref: '#/components/parameters/id' }
      responses:
        '200':
          description: Collaboration state
          content:
            application/json:
              schema:
                type: object
                required: [active]
                properties:
                  active: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/projects/{projectId}/collaboration/{target}/{id}/projection:
    post:
      summary: Publish the text of a confirmed shared revision to its task or note
      description: Requires CSRF and edit access to the item. Already published revisions are idempotent. A newer projection must match the latest stored revision.
      parameters:
        - { $ref: '#/components/parameters/projectId' }
        - { $ref: '#/components/parameters/sharedTextTarget' }
        - { $ref: '#/components/parameters/id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, text]
              properties:
                revision: { type: integer, format: int64, minimum: 1 }
                text: { type: string, maxLength: 1000, description: Tasks allow up to 255 UTF-16 code units. Retrospective notes are required. }
      responses:
        '204': { description: Projection published or already present }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/projects/{projectId}/metrics:
    get:
      summary: Calculate project metrics or selected sprint metrics
      parameters:
        - { $ref: '#/components/parameters/projectId' }
        - in: query
          name: sprintId
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Project or sprint-scoped metrics derived from current state and persisted workflow history
          content:
            application/json:
              schema:
                type: object
                properties:
                  cycleTimeHours: { type: number, format: double, nullable: true }
                  leadTimeHours: { type: number, format: double, nullable: true }
                  throughput: { type: integer, format: int64, description: Selected scope throughput; last 14 days for a project or the selected sprint }
                  throughputLast14Days: { type: integer, format: int64 }
                  velocityStoryPoints: { type: integer, format: int64, description: Points captured on persisted Done transitions }
                  taskCount: { type: integer }
                  completionRate: { type: integer, description: Current completed-task percentage }
                  burndownAvailable: { type: boolean }
                  completedSprints:
                    type: array
                    description: Completed sprints in this project. Delivery replays workflow state at actual closure; later task edits or moves do not rewrite delivered points. Entries with invalid closure timestamps are withheld.
                    items:
                      type: object
                      required: [id, name, completedAt, plannedStoryPoints, actualStoryPoints, completedTasks]
                      properties:
                        id: { type: integer, format: int64 }
                        name: { type: string }
                        completedAt: { type: string, format: date-time }
                        plannedStoryPoints: { type: integer, minimum: 0, description: The sprint's current planned estimate }
                        actualStoryPoints: { type: integer, minimum: 0, description: Persisted Done point snapshots at closure }
                        completedTasks: { type: integer, minimum: 0, description: Tasks in Done for this sprint at closure }
                  burndown:
                    type: array
                    items:
                      type: object
                      required: [date, remainingPoints]
                      properties:
                        date: { type: string, format: date }
                        remainingPoints: { type: integer }
  /api/projects/{projectId}/activity:
    get:
      summary: List project activity for an authorized member
      parameters: [{ $ref: '#/components/parameters/projectId' }]
      responses: { '200': { description: Project activity } }
    delete:
      summary: Clear project activity as an owner or admin
      parameters: [{ $ref: '#/components/parameters/projectId' }]
      responses: { '204': { description: Activity cleared } }
  /api/projects/{projectId}/activity/{activityId}:
    put:
      summary: Edit an activity summary as an owner or admin
      parameters:
        - { $ref: '#/components/parameters/projectId' }
        - in: path
          name: activityId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [summary]
              properties:
                summary: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { description: Updated activity }

    post:
      summary: Create a limited public report snapshot as an owner/admin
      description: Optional sprintId. Returns id, path (`/report/{token}`, a client route of the web app) with a random token, and expiresAt. Tokens are hashed in storage; reports expire after seven days.
      responses: { '200': { description: New report link }, '403': { $ref: '#/components/responses/Error' } }

  /api/projects/{projectId}/forecast:
    parameters:
    - $ref: '#/components/parameters/projectId'
    get:
      summary: Read Monte Carlo delivery forecasts and a work-target probability
      description: All project members may read, including archived projects. Outsiders and trashed projects
        are denied. The query never changes recorded work. Full ISO weeks (up to 104) or completed-sprint
        velocity (up to 52) form the history. Dates use UTC calendar days. Custom target dates range from
        today to 1825 days ahead. Independent period resampling and uniform accrual within a period are
        assumptions; history may not represent future capacity. Default amounts exceeding 10,000 are rejected,
        never truncated.
      parameters:
      - in: query
        name: basis
        schema:
          type: string
          enum:
          - THROUGHPUT
          - VELOCITY
      - in: query
        name: remaining
        schema:
          type: integer
          minimum: 0
          nullable: true
          maximum: 10000
      - in: query
        name: targetItems
        schema:
          type: integer
          minimum: 0
          nullable: true
          maximum: 10000
      - in: query
        name: targetDate
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: epicId
        schema:
          type: integer
          format: int64
          minimum: 1
          nullable: true
      responses:
        '200':
          description: Reproducible forecast and data-quality warnings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/projects/{projectId}/forecast/backtest:
    parameters:
    - $ref: '#/components/parameters/projectId'
    get:
      summary: Compare forecasting models on the selected project's history
      description: Project members may read archived projects. The lowest rolling-origin mean CRPS
        selects a model for the prediction over the next two complete periods. At least 15 complete
        periods and one positive period are required.
      parameters:
      - in: query
        name: basis
        schema: { type: string, enum: [THROUGHPUT, VELOCITY], default: THROUGHPUT }
      responses:
        '200':
          description: Calibration scores and the selected model's prediction, or insufficient history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForecastBacktestResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/projects/{projectId}/task-risk:
    parameters:
    - $ref: '#/components/parameters/projectId'
    get:
      summary: Estimate the risk of unfinished work at sprint end
      description: Current project members can read predictions for unfinished tasks in the active sprint.
        Returns an empty task list when no active sprint has a current end date. The read changes no project state.
      responses:

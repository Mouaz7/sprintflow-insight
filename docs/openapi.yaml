          format: date
        source:
          type: string
          enum:
          - REQUEST
          - ACTIVE_SPRINT
          - DEFAULT
        items:
          type: array
          items:
            $ref: '#/components/schemas/ForecastItemsAtConfidence'
        histogram:
          type: array
          items:
            $ref: '#/components/schemas/ForecastBin'
          maxItems: 20
      nullable: true
    ForecastTarget:
      type: object
      required:

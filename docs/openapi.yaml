    ForecastQuery:
      type: object
      required: []
      properties:
        basis:
          type: string
          enum:
          - THROUGHPUT
          - VELOCITY
        remaining:
          type: integer
          minimum: 0
          nullable: true
          maximum: 10000
        targetItems:
          type: integer
          minimum: 0
          nullable: true
          maximum: 10000
        targetDate:
          type: string
          format: date
          nullable: true
        epicId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
    ForecastResponse:
      type: object
      required:
      - basis
      - unit
      - periodDays
      - start
      - seed
      - simulations
      - minimumPeriods
      - history
      - warnings
      - scope
      - remaining
      - completionDates
      - completionHistogram
      - beyondHorizon
      - horizonDays
      - itemsByDate
      - target
      properties:
        basis:
          type: string
          enum:
          - THROUGHPUT
          - VELOCITY
        unit:
          type: string
          enum:
          - ITEMS
          - STORY_POINTS
        periodDays:
          type: integer
          minimum: 1
        start:
          type: string
          format: date
        seed:
          type: string
          description: Unsigned 64-bit history seed encoded as decimal text to preserve precision.
        simulations:
          type: integer
          minimum: 0
          enum:
          - 0
          - 10000
        minimumPeriods:
          type: integer
          minimum: 0
          enum:
          - 6
        history:
          type: array
          items:
            $ref: '#/components/schemas/ForecastHistoryPeriod'
        warnings:
          type: array
          items:
            type: string
            enum:
            - NO_HISTORY
            - NO_COMPLETIONS
            - INSUFFICIENT_HISTORY
            - MISSING_TASK_HISTORY
            - UNPLANNED_STORIES
            - ZERO_POINT_TASKS
            - EPIC_USES_PROJECT_HISTORY
            - PAST_SPRINT_DEADLINE
            - TARGET_BEYOND_HORIZON
        scope:
          $ref: '#/components/schemas/ForecastWorkScope'
        remaining:
          type: integer
          minimum: 0
          maximum: 10000
        completionDates:
          type: array
          items:
            $ref: '#/components/schemas/ForecastCompletionDate'
          minItems: 3
          maxItems: 3
        completionHistogram:
          type: array
          items:
            $ref: '#/components/schemas/ForecastBin'
          maxItems: 20
        beyondHorizon:
          type: integer
          minimum: 0
          maximum: 10000
        horizonDays:
          type: integer
          minimum: 0
          enum:
          - 1825
        itemsByDate:
          $ref: '#/components/schemas/ForecastItemsByDate'
        target:
          $ref: '#/components/schemas/ForecastTarget'
      description: B6 bootstrap forecast from 10,000 shared paths when usable history exists. With no history
        or no observed completions there are zero simulations, null positive-work probabilities and no by-date
        distribution; a zero-work target remains trivially certain. Dates are empirical upper delivery quantiles;
        quantities are largest counts reached in at least the stated share of paths. Missing/censored completions
        remain in the denominator. No backtesting/model selection is performed here. Six periods is guidance,
        not a validated baseline.
    ProjectTaskRisk:
      type: object
      required: [sprintId, trainedAt, exampleCount, tasks]
      properties:
        sprintId: { type: integer, format: int64, nullable: true }
        trainedAt: { type: string, format: date-time, nullable: true }
        exampleCount: { type: integer, minimum: 0, maximum: 5000 }
        tasks:
          type: array
          items:
            type: object
            required: [taskId, prediction]
            properties:
              taskId: { type: integer, format: int64 }
              prediction: { $ref: '#/components/schemas/TaskRiskPrediction' }
    TaskRiskPrediction:
      type: object
      required: [probability, source, topReasons]
      properties:
        probability: { type: number, format: double, minimum: 0, maximum: 1, exclusiveMinimum: true, exclusiveMaximum: true }
        source: { type: string, enum: [TRAINED, HEURISTIC] }
        topReasons:
          type: array
          maxItems: 3
          items:
            type: object
            required: [feature, logOdds]
            properties:
              feature:
                type: string
                enum: [AGE_IN_COLUMN_VS_P85, TIMES_BLOCKED, REASSIGNMENTS, COMMENTS_LAST_7_DAYS, STORY_POINTS, DEPENDENCY_DEPTH, REMAINING_SPRINT_DAYS, COLUMN_WIP]
              logOdds: { type: number, format: double, description: Positive raises risk and negative lowers it. }
    ForecastBacktestResponse:
      type: object
      required: [basis, unit, periodDays, availablePeriods, requiredPeriods, trainingPeriods, horizonPeriods, seed, status, candidates]
      properties:
        basis: { type: string, enum: [THROUGHPUT, VELOCITY] }
        unit: { type: string, enum: [ITEMS, STORY_POINTS] }
        periodDays: { type: integer, minimum: 1 }
        availablePeriods: { type: integer, minimum: 0 }
        requiredPeriods: { type: integer, minimum: 1 }
        trainingPeriods: { type: integer, minimum: 1 }
        horizonPeriods: { type: integer, minimum: 1 }
        seed: { type: string, pattern: '^[0-9]+$' }
        status: { type: string, enum: [SELECTED, INSUFFICIENT_HISTORY, NO_COMPLETIONS] }
        selectedModel: { type: string, enum: [gamma-poisson, ewma-poisson, bootstrap-monte-carlo], nullable: true }
        prediction:
          type: object
          nullable: true
          required: [median, intervals]
          properties:
            median: { type: integer, minimum: 0 }
            intervals:
              type: array
              items:
                type: object
                required: [confidence, lower, upper]
                properties:
                  confidence: { type: number, enum: [0.5, 0.85, 0.95] }
                  lower: { type: integer, minimum: 0 }
                  upper: { type: integer, minimum: 0 }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/ForecastBacktestCandidate' }
    ForecastBacktestCandidate:
      type: object
      required: [model, origins, meanCrps, coverage, pitHistogram, medianAbsoluteError]
      properties:
        model: { type: string, enum: [gamma-poisson, ewma-poisson, bootstrap-monte-carlo] }
        origins: { type: integer, minimum: 6 }
        meanCrps: { type: number, minimum: 0 }
        coverage:
          type: object
          additionalProperties: { type: number, minimum: 0, maximum: 1 }
        pitHistogram:
          type: array

apiVersion: 1
datasources:
  - name: Prometheus
    uid: sprintflow-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: sprintflow-tempo
  - name: Tempo
    uid: sprintflow-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false

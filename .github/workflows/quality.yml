name: Quality and package check

# Branch protection requires the job ids quality, docker, security and mutation.
# Keep those ids (and do not add a `name:` to them) so the required checks still match.

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      evaluate_replicas:
        description: Measure realtime and CRDT delivery at one and two replicas in kind
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_IMAGE: sprintflow-insight-app:ci

jobs:
  quality:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/e2e/package-lock.json
            scripts/package-lock.json
      - name: Check repository documentation, exclusions and action pinning
        run: node scripts/verification/repository-check.ts
      - run: npm ci --prefix scripts
      - name: Type-check verification scripts
        run: npm run check --prefix scripts
      - run: npm ci --prefix frontend
      - run: npm run check --prefix frontend
      - name: Type-check end-to-end tests
        run: |
          npm ci --prefix frontend/e2e
          npm run typecheck --prefix frontend/e2e
      # Full build: tests, coverage gates, package and SBOM. Bounded parser fuzzing follows.
      # CodeQL analyses Java without a build, and the Docker image skips tests.
      - name: Verify backend and package the app
        run: ./mvnw -B -ntp verify
        working-directory: backend
      - name: Fuzz import and automation parsers
        working-directory: backend
        env:
          JAZZER_FUZZ: '1'
          JAVA_TOOL_OPTIONS: '-Xmx1024m'
        run: |
          ./mvnw -B -ntp '-Dtest=ImportParserFuzzTest#csv' '-Djazzer.instrumentation_includes=com.sprintflowinsight.workspace.transfer.**' test
          ./mvnw -B -ntp '-Dtest=ImportParserFuzzTest#jira' '-Djazzer.instrumentation_includes=com.sprintflowinsight.workspace.transfer.**' test
          ./mvnw -B -ntp '-Dtest=AutomationDslFuzzTest' '-Djazzer.instrumentation_includes=com.sprintflowinsight.automation.**' test
      - name: Upload backend coverage and test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
          if-no-files-found: error
          retention-days: 7
      - name: Verify the packaged app contains the frontend and its SBOM
        shell: bash
        working-directory: backend
        run: |
          jar tf target/*.jar > "$RUNNER_TEMP/jar-contents.txt"
          grep -q 'BOOT-INF/classes/static/index.html' "$RUNNER_TEMP/jar-contents.txt"
          grep -q '^META-INF/sbom/application.cdx.json' "$RUNNER_TEMP/jar-contents.txt"
      - name: Collect CycloneDX SBOMs
        shell: bash
        run: |
          npm run sbom --prefix scripts
          cp backend/target/classes/META-INF/sbom/application.cdx.json artifacts/sbom/backend.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: artifacts/sbom/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprintflow-insight-package
          path: backend/target/sprintflow-insight-*.jar
          if-no-files-found: error
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image with a layer cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: ${{ env.CI_IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/sprintflow-image.tar
          cache-from: type=gha,scope=sprintflow-image
          cache-to: type=gha,scope=sprintflow-image,mode=max
      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/sprintflow-image.tar"
      - name: Confirm the runtime image has no curl or wget
        run: |
          if docker run --rm --entrypoint sh "$CI_IMAGE" -c 'command -v curl || command -v wget'; then
            echo 'The runtime image must not contain curl or wget.' >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Prepare isolated settings with the shared bootstrap
        run: scripts/env-bootstrap.sh
      - name: Start containers
        env:
          SPRINTFLOW_APP_IMAGE: ${{ env.CI_IMAGE }}
        run: docker compose -p sprintflow-ci up -d --no-build --wait --wait-timeout 180
      - name: Verify account, workflow, and non-root uploads
        run: node scripts/verification/container-smoke.ts prepare
      - name: Restart containers and verify persistence
        env:
          SPRINTFLOW_APP_IMAGE: ${{ env.CI_IMAGE }}
        run: |
          docker compose -p sprintflow-ci restart
          docker compose -p sprintflow-ci up -d --no-build --wait --wait-timeout 180
          node scripts/verification/container-smoke.ts verify
      - name: Verify Prometheus, Tempo, and the provisioned Grafana dashboard
        env:
          SPRINTFLOW_APP_IMAGE: ${{ env.CI_IMAGE }}
          SPRINTFLOW_TRACING_EXPORT: "true"
          SPRINTFLOW_TRACE_SAMPLE_RATE: "1"
        run: bash scripts/verification/observability-smoke.sh sprintflow-ci
      - name: Logs
        if: failure()
        run: docker compose -p sprintflow-ci --profile observability logs --tail 100
      - name: Remove isolated CI containers
        if: always()
        run: docker compose -p sprintflow-ci --profile observability down -v
      - name: Share the tested image with later jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprintflow-image
          path: ${{ runner.temp }}/sprintflow-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  kubernetes:
    needs: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sprintflow-image
          path: ${{ runner.temp }}/sprintflow-image
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/e2e/package-lock.json
      - name: Verify pinned Kubernetes tools and lint the chart
        run: |
          tools="$RUNNER_TEMP/kubernetes-tools"
          bash scripts/verification/kubernetes-tools.sh "$tools"
          echo "$tools" >> "$GITHUB_PATH"
          "$tools/helm" lint deploy/helm/sprintflow -f deploy/kind/values.yaml --set image.tag=current
      - name: Build the previous version and load the tested current image
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          previous="$RUNNER_TEMP/sprintflow-previous"
          mkdir "$previous"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA="$(git rev-parse HEAD^)"; fi
          git archive "$BASE_SHA" | tar -x -C "$previous"
          docker build --tag sprintflow-k8s:previous "$previous"
          docker load --input "$RUNNER_TEMP/sprintflow-image/sprintflow-image.tar"
          docker tag "$CI_IMAGE" sprintflow-k8s:current
      - name: Verify the rolling upgrade and the original shared session
        run: bash scripts/verification/kubernetes-smoke.sh "$RUNNER_TEMP/kubernetes-tools/traefik.tgz"
      - name: Install Chromium
        working-directory: frontend/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Remove the pod serving the browser connection and verify event replay
        working-directory: frontend/e2e
        env:
          E2E_KIND_CONTEXT: kind-sprintflow-ci
          E2E_BASE_URL: http://127.0.0.1:18080
        run: npx playwright test kubernetes-failover.e2e.ts --retries=0
      - name: Measure live delivery with two and one replicas
        if: inputs.evaluate_replicas
        run: |
          npm ci --prefix scripts
          mkdir -p "$RUNNER_TEMP/realtime-results"
          kubectl --context kind-sprintflow-ci -n sprintflow-ci rollout status deployment/sprintflow --timeout=180s
          test "$(kubectl --context kind-sprintflow-ci -n sprintflow-ci get deployment sprintflow -o jsonpath='{.status.readyReplicas}')" = 2
          node scripts/evaluation/realtime-load.ts http://127.0.0.1:18080 2 "$RUNNER_TEMP/realtime-results/cluster.json"
          kubectl --context kind-sprintflow-ci -n sprintflow-ci delete hpa sprintflow
          kubectl --context kind-sprintflow-ci -n sprintflow-ci scale deployment/sprintflow --replicas=1
          kubectl --context kind-sprintflow-ci -n sprintflow-ci rollout status deployment/sprintflow --timeout=180s
          kubectl --context kind-sprintflow-ci -n sprintflow-ci wait deployment/sprintflow --for=jsonpath='{.status.readyReplicas}'=1 --timeout=120s
          node scripts/evaluation/realtime-load.ts http://127.0.0.1:18080 1 "$RUNNER_TEMP/realtime-results/single.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.evaluate_replicas
        with:
          name: realtime-replica-evaluation
          path: ${{ runner.temp }}/realtime-results/
          if-no-files-found: error
          retention-days: 30
      - name: Show the isolated cluster state
        if: failure()
        run: |
          kubectl --context kind-sprintflow-ci get pods,services,ingress -A || true
          kubectl --context kind-sprintflow-ci -n sprintflow-ci get events --sort-by=.lastTimestamp || true
          kubectl --context kind-sprintflow-ci -n sprintflow-ci logs -l app.kubernetes.io/name=sprintflow --all-containers --tail=60 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kubernetes-failover-report
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove the isolated cluster
        if: always()
        run: if command -v kind >/dev/null; then kind delete cluster --name sprintflow-ci; fi

  mutation:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Mutation tests for pure logic
        working-directory: backend
        run: ./mvnw -B -ntp test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Upload mutation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-mutation-report
          path: backend/target/pit-reports/
          if-no-files-found: error
          retention-days: 7

  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanners and verify checksums
        shell: bash
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          curl -fsSL https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 -o /tmp/osv-scanner
          echo '160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  /tmp/osv-scanner' | sha256sum -c -
          chmod +x /tmp/osv-scanner
      - name: Check committed history for secrets
        run: /tmp/gitleaks git . --redact --no-banner
      - name: Audit resolved runtime and tooling dependencies
        run: >-
          /tmp/osv-scanner scan source
          --lockfile frontend/package-lock.json
          --lockfile frontend/e2e/package-lock.json
          --lockfile scripts/package-lock.json
          --lockfile backend/pom.xml
          --config osv-scanner.toml --format json --output-file dependency-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/e2e/package-lock.json
      - uses: ./.github/actions/start-app
      - run: npm ci --prefix frontend/e2e
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/e2e/package-lock.json') }}
      - name: Install Chromium and its system dependencies
        working-directory: frontend/e2e
        run: npx playwright install --with-deps chromium
      - name: Playwright flows with axe
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8081
          E2E_TOXIPROXY_API: http://127.0.0.1:8474
        run: |
          proxy_dir="$(mktemp -d)"
          archive="$proxy_dir/toxiproxy.tar.gz"
          curl -fsSL https://github.com/Shopify/toxiproxy/releases/download/v2.12.0/toxiproxy_2.12.0_linux_amd64.tar.gz -o "$archive"
          echo "65e042d3fc2290c099527bc506446a6fd863a09f113b8944b636ece70221c2b3  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$proxy_dir" toxiproxy-server
          "$proxy_dir/toxiproxy-server" -host 127.0.0.1 -port 8474 > "$proxy_dir/toxiproxy.log" 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid"' EXIT
          curl -fsS --retry 6 --retry-connrefused "$E2E_TOXIPROXY_API/version"
          export E2E_DB_CONTAINER="$(docker compose -p sprintflow-ci ps -q postgres)"
          npm run e2e
      - name: Logs
        if: failure()
        run: docker compose -p sprintflow-ci logs --tail 150
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  image-scan:
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sprintflow-image
          path: ${{ runner.temp }}/sprintflow-image
      - name: Install Trivy and verify its checksum
        shell: bash
        run: |
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz -o /tmp/trivy.tar.gz
          echo 'bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  /tmp/trivy.tar.gz' | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
      - name: Image SBOM (CycloneDX)
        run: /tmp/trivy image --quiet --input "$RUNNER_TEMP/sprintflow-image/sprintflow-image.tar" --format cyclonedx --output image.cdx.json
      - name: Vulnerability report (SARIF)
        run: >-
          /tmp/trivy image --quiet --input "$RUNNER_TEMP/sprintflow-image/sprintflow-image.tar"
          --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --format sarif --output trivy.sarif
      - name: Upload to code scanning
        # Fork pull requests get a read-only token; their results stay in the artifact.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: Fail on fixable critical vulnerabilities
        run: >-
          /tmp/trivy image --quiet --input "$RUNNER_TEMP/sprintflow-image/sprintflow-image.tar"
          --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-scan
          path: |
            image.cdx.json
            trivy.sarif
          if-no-files-found: ignore
          retention-days: 30

  zap-baseline:
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/start-app
      - name: OWASP ZAP baseline (passive scan)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:8081/
          docker_name: ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
          rules_file_name: .zap/rules.tsv
          cmd_options: -a -j
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline-report

  k6-smoke:
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/start-app
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0
        with:
          k6-version: '2.4.0'
      - name: Authenticated workspace read smoke test
        env:
          BASE_URL: http://127.0.0.1:8081
          K6_PROFILE: smoke
        run: k6 run --summary-export k6-summary.json scripts/performance/workspace-read.k6.ts
      - name: Seed two years of flow history and measure 30/180-day reads
        env:
          BASE_URL: http://127.0.0.1:8081
          FLOW_FIXTURE_FILE: ${{ runner.temp }}/flow-fixture.json
        run: |
          export FLOW_DB_CONTAINER="$(docker compose -p sprintflow-ci ps -q postgres)"
          node scripts/performance/flow-fixture.ts seed
          k6 run --summary-export flow-k6-summary.json scripts/performance/flow-read.k6.ts
      - name: Remove the disposable flow fixture
        if: always()
        env:
          BASE_URL: http://127.0.0.1:8081
          FLOW_FIXTURE_FILE: ${{ runner.temp }}/flow-fixture.json
        run: node scripts/performance/flow-fixture.ts cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: k6-smoke-summary
          path: |
            k6-summary.json
            flow-k6-summary.json
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    # Informational: not a required check. Desktop budgets fail the job; mobile is reported.
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/e2e/package-lock.json
      - uses: ./.github/actions/start-app
      - run: npm ci --prefix frontend/e2e
      - name: Lighthouse CI budgets (LCP, TBT as INP proxy, CLS, script size)
        env:
          E2E_BASE_URL: http://127.0.0.1:8081
        run: npm run lighthouse --prefix frontend/e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-report
          path: frontend/e2e/lighthouse-report/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    # Only main pushes publish. Pull requests (including forks) never receive these permissions.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ quality, docker, security, mutation, e2e, image-scan, kubernetes ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sprintflow-image
          path: ${{ runner.temp }}/sprintflow-image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-scan
          path: ${{ runner.temp }}/image-scan
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        id: push
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker load --input "$RUNNER_TEMP/sprintflow-image/sprintflow-image.tar"
          for tag in "sha-${GITHUB_SHA}" main; do
            docker tag "$CI_IMAGE" "$image:$tag"
            docker push "$image:$tag"
          done
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image:main")"
          digest="${digest#*@}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image (keyless, GitHub OIDC)
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: SBOM attestation
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/image-scan/image.cdx.json
          push-to-registry: true

  storybook:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/e2e/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm ci --prefix frontend/e2e
      - name: Build the component catalogue
        run: npm run storybook:build --prefix frontend
      - name: Install the pinned Chromium
        working-directory: frontend/e2e
        run: npx playwright install --with-deps chromium
      - name: Compare light/dark stories and verify accessibility and keyboard controls
        run: npm run visual --prefix frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: storybook-visual-report
          path: |
            frontend/e2e/playwright-report/visual/
            frontend/e2e/test-results/visual/
          retention-days: 7

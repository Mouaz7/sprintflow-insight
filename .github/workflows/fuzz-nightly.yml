name: Nightly parser fuzzing

on:
  schedule:
    - cron: '35 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-parser-fuzzing
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Fuzz CSV, Jira and automation parsers
        working-directory: backend
        env:
          JAZZER_FUZZ: '1'
          JAVA_TOOL_OPTIONS: '-Xmx1024m'
        run: |
          ./mvnw -B -ntp '-Dtest=ImportParserFuzzTest#csv' '-Djazzer.instrumentation_includes=com.sprintflowinsight.workspace.transfer.**' test
          ./mvnw -B -ntp '-Dtest=ImportParserFuzzTest#jira' '-Djazzer.instrumentation_includes=com.sprintflowinsight.workspace.transfer.**' test
          ./mvnw -B -ntp '-Dtest=AutomationDslFuzzTest' '-Djazzer.instrumentation_includes=com.sprintflowinsight.automation.**' test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-fuzz-reports
          path: |
            backend/target/surefire-reports/
            backend/src/test/resources/**/*Crash_*
          if-no-files-found: ignore
          retention-days: 14

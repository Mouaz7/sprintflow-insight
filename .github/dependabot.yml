version: 2

# Weekly, grouped updates. The cooldown leaves new releases a week to be yanked
# or flagged before they are proposed, which limits exposure to hijacked packages.
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      maven-minor-and-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: npm
    directories: [ /frontend, /frontend/e2e, /scripts ]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      npm-minor-and-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: github-actions
    directories: [ /, /.github/actions/start-app ]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      github-actions:
        patterns: [ '*' ]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    ignore:
      # The project follows even-numbered Node.js LTS releases; odd majors are
      # short-lived "current" releases that never become LTS.
      - dependency-name: node
        versions: [ '>= 25, < 26', '>= 27, < 28', '>= 29, < 30' ]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    ignore:
      # The app, Testcontainers and the docs target PostgreSQL 16. A major
      # upgrade is a platform decision that changes all of them together.
      - dependency-name: postgres
        update-types: [ version-update:semver-major ]
